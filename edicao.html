<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Edição · Daime Filmes</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="preload" href="fonts/OpenRunde-Semibold.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Open Runde";src:url(fonts/OpenRunde-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Open Runde";src:url(fonts/OpenRunde-Medium.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Open Runde";src:url(fonts/OpenRunde-Semibold.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Open Runde";src:url(fonts/OpenRunde-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
</style>
<style>
:root{
  --canvas:#F7F6F4; --surface:#ffffff; --muted:#F1EDE9; --ink:#1C1917; --ink-2:#6B6460; --ink-3:#9C948E;
  --line:#ECE8E4; --hover:rgb(28 25 23 / .05); --accent:#1C1917; --accent-hover:#3A3532; --accent-soft:rgb(217 98 43 / .12);
  --e-a_fazer:#8b8880; --e-em_edicao:#2F6FE0; --e-para_revisar:#d9622b; --e-ajustes:#b9800b; --e-reenviado:#7C5CFA; --e-aprovado:#12A150;
  --ok:#17633b; --ok-soft:#eaf6ee; --warn:#825310; --warn-soft:#fff5dc; --danger:#a52626; --danger-soft:#fff0ef;
  --display:"Open Runde","Inter",system-ui,-apple-system,sans-serif; --r-panel:1.25rem; --r-control:.875rem;
  --shadow:0 1px 2px rgb(28 25 23 / .04), 0 10px 30px rgb(28 25 23 / .06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100dvh;background:var(--canvas);color:var(--ink);
  font:14px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
a{color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 18px 60px}
.cartao{background:rgb(255 255 255 / .9);border:1px solid var(--line);border-radius:var(--r-panel);box-shadow:var(--shadow)}
.vidro{background:rgb(255 255 255 / .66);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgb(255 255 255 / .7);border-radius:var(--r-panel);box-shadow:var(--shadow)}
@media (prefers-reduced-transparency: reduce){.vidro{background:var(--surface);backdrop-filter:none}}

/* topo */
.topo{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin:8px 0 18px}
.topo h1{font-family:var(--display);margin:0;font-size:32px;line-height:1.1;letter-spacing:-.025em;font-weight:700}
.topo p{margin:6px 0 0;color:var(--ink-2);font-size:15px}
.acoes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:rgb(255 255 255 / .8);font-size:13px;font-weight:600;transition:background-color .15s, transform .1s}
.btn:hover{background:var(--muted)}
.btn:active{transform:scale(.97)}
.btn.prim{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.prim:hover{background:var(--accent-hover)}
.btn.aviso{background:var(--warn-soft);border-color:#f0d99f;color:var(--warn)}
.btn.peq{min-height:32px;padding:0 12px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:5px 11px;background:var(--ok-soft);color:var(--ok)}
.chip.off{background:var(--warn-soft);color:var(--warn)}
.aviso-box{margin:0 0 14px;padding:12px 14px;border-radius:var(--r-control);border:1px solid var(--line);background:var(--surface);font-size:13px}
.aviso-box.erro{border-color:#f0c4c0;background:var(--danger-soft);color:var(--danger)}
.aviso-box.ok{border-color:#b8ddc4;background:var(--ok-soft);color:var(--ok)}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* linha do tempo das etapas */
.fluxo{padding:14px 14px 10px;margin-bottom:16px}
.fluxo .tit{margin:0 4px 10px;font-size:12px;font-weight:600;color:var(--ink-2)}
.etapas{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
@media (min-width:720px){.etapas{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1100px){.etapas{grid-template-columns:1fr 1fr 1fr 1px 1fr;align-items:stretch;gap:8px}}
.etapa{position:relative;display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 10px;border:0;border-radius:var(--r-control);background:none;text-align:left;transition:background-color .15s, transform .1s}
.etapa:hover{background:var(--hover)}
.etapa:active{transform:scale(.97)}
.etapa[aria-pressed=true]{background:var(--accent-soft);box-shadow:inset 0 0 0 1px rgb(217 98 43 / .35)}
.etapa .bola{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.etapa .bola svg{width:15px;height:15px;stroke-width:2.3}
.etapa b{display:block;font-size:13px;line-height:1.2}
.etapa small{display:block;font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.etapa .n{margin-left:auto;font-size:12px;font-weight:600;color:var(--ink-2);background:var(--muted);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
.etapa .seta{position:absolute;right:-10px;top:50%;transform:translateY(-50%);color:var(--ink-3);display:none}
@media (min-width:1100px){.etapa .seta{display:block}}
.divisor{display:none}
@media (min-width:1100px){.divisor{display:block;background:var(--line);align-self:center;height:70%}}
.volta{margin:8px 4px 0;font-size:11.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px}

/* fila + detalhe */
.grade{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:1100px){.grade{grid-template-columns:minmax(19rem,.8fr) minmax(0,1.7fr)}}
.fila{overflow:hidden;align-self:start}
.fila-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-2)}
.fila-h span:last-child{background:var(--muted);color:var(--ink);font-size:10px;border-radius:999px;padding:3px 9px}
.fila-corpo{max-height:680px;overflow:auto}
.grupo{border-bottom:1px solid var(--line)}
.grupo:last-child{border-bottom:0}
.grupo>h3{margin:0}
.grupo-bt{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:0 16px;border:0;background:rgb(255 255 255 / .9);backdrop-filter:blur(16px);font-size:13px;font-weight:600;text-align:left}
.grupo-bt:hover{background:var(--muted)}
.grupo-bt .chev{color:var(--ink-3);transition:transform .2s cubic-bezier(.23,1,.32,1)}
.grupo-bt[aria-expanded=true] .chev{transform:rotate(90deg)}
.grupo-bt .pt{width:8px;height:8px;border-radius:50%}
.grupo-bt .n{margin-left:auto;color:var(--ink-2);font-variant-numeric:tabular-nums}
.grupo-c{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.23,1,.32,1)}
.grupo-c.aberto{grid-template-rows:1fr}
.grupo-c>div{overflow:hidden}
.grupo-c.aberto>div{padding:0 6px 6px}
.vazio-g{padding:2px 12px 10px;font-size:12px;color:var(--ink-2)}
@media (prefers-reduced-motion: reduce){.grupo-c,.grupo-bt .chev{transition:none}}
.linha{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;width:100%;padding:8px;border:0;border-radius:var(--r-control);background:none;text-align:left}
.linha:hover{background:var(--hover)}
.linha[aria-pressed=true]{background:var(--accent);color:#fff}
.linha[aria-pressed=true] .sub,.linha[aria-pressed=true] .data{color:rgb(255 255 255 / .82)}
.linha[aria-pressed=true] .v{background:rgb(255 255 255 / .22);color:#fff}
.mini{width:44px;height:44px;border-radius:.65rem;display:grid;place-items:center;color:#fff}
.mini svg{width:18px;height:18px}
.nome{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{display:flex;gap:6px;align-items:center;margin-top:2px;font-size:11.5px;color:var(--ink-2);min-width:0}
.sub span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub .atrasado{color:var(--danger);font-weight:600}
.v{font-size:10px;font-weight:700;background:var(--muted);color:var(--ink);border-radius:4px;padding:0 4px;flex:none}
.barras{display:flex;gap:2px;margin-top:5px}
.barras i{display:block;width:14px;height:3px;border-radius:2px}
.prazo{align-self:start;display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;background:var(--muted);color:var(--ink)}
.prazo svg{width:12px;height:12px}
.prazo.urgente{background:var(--warn-soft);color:var(--warn);box-shadow:inset 0 0 0 1px #f0d99f}
.prazo.atrasado{background:var(--danger-soft);color:var(--danger);box-shadow:inset 0 0 0 1px #f0c4c0}
.linha[aria-pressed=true] .prazo{background:rgb(255 255 255 / .22);color:#fff;box-shadow:none}
.det-prazo{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:8px 12px;border-radius:var(--r-control);background:var(--muted);font-size:14px;font-weight:700}
.det-prazo svg{width:16px;height:16px}
.det-prazo small{font-weight:500;color:var(--ink-2);font-size:12px}
.det-prazo.urgente{background:var(--warn-soft);color:var(--warn)}
.det-prazo.atrasado{background:var(--danger-soft);color:var(--danger)}
.alerta-prazo{display:flex;gap:12px;align-items:flex-start;margin:0 0 14px;padding:12px 14px;border-radius:var(--r-control);border:1px solid #f0d99f;background:var(--warn-soft);color:var(--warn);font-size:13px}
.alerta-prazo.atrasado{border-color:#f0c4c0;background:var(--danger-soft);color:var(--danger)}
.alerta-prazo > svg{width:20px;height:20px;flex:none;margin-top:1px}
.alerta-prazo b{display:block;font-size:14px}
.alerta-prazo ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.alerta-prazo button{border:1px solid currentColor;background:rgb(255 255 255 / .6);color:inherit;border-radius:999px;padding:3px 10px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.alerta-prazo button:hover{background:#fff}
.data{align-self:start;padding-top:2px;font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}

.detalhe{padding:18px;min-height:460px}
@media (min-width:720px){.detalhe{padding:24px}}
.det-vazio{display:grid;place-items:center;min-height:400px;text-align:center;color:var(--ink-2);font-size:13px}
.det-topo{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-start;padding-bottom:14px;border-bottom:1px solid var(--line)}
.selo{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;border-radius:999px;padding:3px 10px}
.selo .pt{width:6px;height:6px;border-radius:50%}
.det-topo h2{margin:8px 0 2px;font-size:22px;letter-spacing:-.02em}
.det-topo .meta{font-size:12.5px;color:var(--ink-2)}
.instr{margin:14px 0 0;padding:12px 14px;border-radius:var(--r-control);background:var(--muted);font-size:13px;white-space:pre-line}
.abas{display:flex;gap:4px;margin:16px 0;padding:3px;border-radius:var(--r-control);background:var(--muted);width:fit-content}
.abas button{border:0;background:none;padding:7px 14px;border-radius:.65rem;font-size:13px;font-weight:600;color:var(--ink-2)}
.abas button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .1)}
.video-grade{display:grid;gap:18px}
@media (min-width:900px){.video-grade{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}}
.player{background:#111;border-radius:var(--r-panel);overflow:hidden;display:grid;place-items:center;min-height:240px;max-height:520px}
.player video{width:100%;max-height:520px;display:block;background:#000}
.player .sem{color:rgb(255 255 255 / .7);font-size:13px;padding:30px;text-align:center}
.versoes{display:flex;gap:4px;margin-top:8px;padding:3px;border-radius:var(--r-control);background:var(--muted)}
.versoes button{flex:1;border:0;background:none;min-height:30px;border-radius:.6rem;font-size:12px;font-weight:600;color:var(--ink-2)}
.versoes button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .1)}
h4{margin:0 0 8px;font-size:13px;color:var(--ink-2)}
.coments{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.coment{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;padding:9px 10px;border-radius:var(--r-control);background:var(--surface);border:1px solid var(--line);font-size:13px}
.coment.rasc{border-style:dashed;background:var(--warn-soft)}
.tc{border:0;border-radius:6px;padding:1px 7px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12px;font-variant-numeric:tabular-nums}
.coment small{display:block;color:var(--ink-2);font-size:11px;margin-top:2px}
.x{border:0;background:none;color:var(--ink-3);padding:2px}
.x:hover{color:var(--danger)}
.campo{width:100%;min-height:40px;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r-control);background:var(--surface);font-size:13px}
textarea.campo{resize:vertical;min-height:70px}
.form-coment{display:grid;grid-template-columns:auto 1fr auto;gap:6px;margin-top:8px}
.coment.resolv{opacity:.62}
.coment.resolv > .c-corpo > span:first-child{text-decoration:line-through;text-decoration-color:var(--ink-3)}
.c-corpo{min-width:0;display:grid;gap:6px}
.c-acoes{display:flex;gap:12px}
.c-acoes button{border:0;background:none;padding:0;font-size:11px;font-weight:600;color:var(--accent)}
.resp{display:flex;gap:6px;align-items:start;justify-content:space-between;padding:6px 8px;border-left:2px solid var(--line);background:var(--muted);border-radius:0 6px 6px 0}
.resp.rasc{border-left-style:dashed}
.form-resp{display:grid;grid-template-columns:1fr auto auto;gap:6px}
.vtag{font-size:10px;font-weight:700;color:var(--ink-2);background:var(--muted);border-radius:4px;padding:0 5px}
.c-topo{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.c-topo h4{margin:0}
.c-filtros{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.c-filtros .campo{min-height:32px;padding:4px 10px;font-size:12px;width:auto}
.c-filtros input[type=search]{width:130px}
.chk{display:flex;gap:5px;align-items:center;font-size:12px;color:var(--ink-2)}
.marcas{position:relative;height:18px;margin-top:8px;border-radius:999px;background:var(--muted);cursor:pointer}
.marcas .cabeca{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--ink);border-radius:2px;pointer-events:none;left:0}
.marca{position:absolute;top:50%;transform:translate(-50%,-50%);min-width:14px;height:14px;padding:0 3px;border-radius:999px;border:2px solid var(--surface);background:var(--e-ajustes);color:#fff;font-size:9px;font-weight:700;line-height:10px}
.marca.ok{background:var(--e-aprovado)}
.marca:hover{transform:translate(-50%,-50%) scale(1.25)}
.etapa-sel{min-height:32px;padding:4px 10px;font-size:12px;width:auto;border-radius:999px}
.links{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.links li{display:grid;gap:4px;padding:10px;border:1px solid var(--line);border-radius:var(--r-control)}
.links li.exp{opacity:.55}
.links small{color:var(--ink-2);font-size:11px}
.sem-rolar{overflow:hidden}
.rev{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:#141413;color:var(--ink);
  --surface:#1f1e1c; --muted:#282725; --line:#34322f; --ink:#eeece8; --ink-2:#aaa69e; --ink-3:#7a766f; --hover:rgb(255 255 255 / .06);
  --accent:#ec7a45; --accent-hover:#f08a5a; --accent-soft:rgb(236 122 69 / .16); --warn:#f0b24a; --warn-soft:rgb(194 124 14 / .16); --ok:#6fd39a; --ok-soft:rgb(47 154 91 / .18)}
.rev .campo{background:#191817;color:var(--ink)}
.rev .btn{background:var(--muted);color:var(--ink);border-color:var(--line)}
.rev .btn.prim{background:var(--accent);border-color:var(--accent);color:#1d1c1a}
.rev-topo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.rev-ic{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.rev-tit{display:flex;flex-direction:column;font-size:14px;line-height:1.2;max-width:34ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rev-tit small{color:var(--ink-2);font-weight:500;font-size:11px}
.rev-sel{min-height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 10px;font-weight:600}
.rev-chip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:600}
.rev-chip.ok{color:var(--ok)}
.rev-chip .pt{width:8px;height:8px;border-radius:50%}
.rev-esp{flex:1}
.rev-bt{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:600}
.rev-bt.prim{background:var(--accent);border-color:var(--accent);color:#1d1c1a}
.rev-bt.aviso{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.rev-bt:disabled{opacity:.5;cursor:default}
.rev-corpo{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:minmax(0,1fr) auto}
.rev-palco{position:relative;min-height:0;overflow:hidden;display:grid;place-items:center;padding:14px;background:#0b0b0a}
/* absoluto: o vídeo ocupa exatamente o palco (com height:100% numa linha auto do grid ele crescia até o tamanho real e cobria os controles) */
.rev-palco video{position:absolute;inset:14px;width:calc(100% - 28px);height:calc(100% - 28px);object-fit:contain;display:block;cursor:crosshair;background:#000}
.rev-palco .sem{color:var(--ink-2)}
.pinos{position:absolute;pointer-events:none}
.pino{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:var(--e-ajustes);color:#fff;font-size:11px;font-weight:700;box-shadow:0 2px 8px rgb(0 0 0 / .5);display:grid;place-items:center}
.pino.ok{background:var(--e-aprovado)}
.pino.novo{background:var(--accent);color:#1d1c1a;animation:pulsar 1.2s ease-in-out infinite}
@keyframes pulsar{50%{box-shadow:0 0 0 8px rgb(236 122 69 / .25)}}
@media (prefers-reduced-motion: reduce){.pino.novo{animation:none}}
.rev-base{position:relative;z-index:1;padding:8px 14px 10px;border-top:1px solid var(--line);background:#181716}
.marcas.grande{height:22px;margin-top:4px;background:#2f2d2a}
.marcas .prog{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:999px;background:rgb(236 122 69 / .35);pointer-events:none}
.marcas.grande .marca{min-width:16px;height:16px}
.rev-ctrl{display:flex;align-items:center;gap:4px;margin-top:8px}
.rev-ctrl button{min-width:36px;height:34px;border-radius:8px;border:0;background:none;color:var(--ink);font-size:14px}
.rev-ctrl button:hover{background:var(--hover)}
.rev-ctrl button[aria-pressed=true]{color:var(--accent);background:var(--accent-soft)}
.rev-tempo{font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink-2);margin-left:8px}

.coment.foco{outline:2px solid var(--accent)}
.pino-ic{color:var(--e-ajustes);font-size:10px}
@media (max-width:899px){
  .rev{overflow:auto}

  .rev-lado{grid-row:auto;grid-column:auto;border-left:0;border-top:1px solid var(--line);overflow:visible}
}
.st-aprov{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.st-aprov button{flex:1 1 auto;min-height:34px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font:inherit;font-size:12.5px;cursor:pointer;color:var(--ink-2)}

.dica{font-size:12px;color:var(--ink-2);margin:6px 0 0}

/* arquivos */
.migalhas{display:flex;flex-wrap:wrap;align-items:center;gap:2px;font-size:13px;margin-bottom:10px}
.migalhas button{border:0;background:none;padding:4px 6px;border-radius:6px;color:var(--ink-2);font-weight:600}
.migalhas button:hover{background:var(--hover);color:var(--ink)}
.migalhas span{color:var(--ink-3)}
.arq-barra{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-bottom:10px}
.arquivos{border:1px solid var(--line);border-radius:var(--r-panel);overflow:hidden;background:var(--surface)}
.arq{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);font-size:13px}
.arq:first-child{border-top:0}
.arq:nth-child(even){background:rgb(235 233 228 / .45)}
.arq .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arq button.nm{border:0;background:none;text-align:left;font-weight:600;padding:0}
.arq button.nm:hover{color:var(--accent)}
.arq .info{color:var(--ink-2);font-size:11.5px;font-variant-numeric:tabular-nums}
.arq .bts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.arq .ic{color:var(--ink-2)}
.arq .ic.pasta{color:#3a8fd6}
.arq .ic.video{color:var(--e-reenviado)}
.arq-vazio{padding:22px;text-align:center;color:var(--ink-2);font-size:13px}

/* linha do tempo da tarefa */
.tl{list-style:none;margin:0;padding:4px 14px;border:1px solid var(--line);border-radius:var(--r-panel);background:var(--surface)}
.tl li{position:relative;display:grid;grid-template-columns:20px 1fr;gap:10px;padding:10px 0}
.tl li:not(:last-child)::after{content:"";position:absolute;left:9px;top:32px;bottom:-4px;width:1.5px;background:var(--line)}
.tl .pt{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;margin-top:1px}

.lista-casas button:first-child{border-top:0}
.lista-casas button:hover{background:var(--hover)}
.lista-casas button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.dois{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.subidos summary{cursor:pointer;font-weight:600;font-size:13px}

.transf-topo span{display:flex;gap:6px;align-items:center}
.transf-lista{max-height:min(50vh,420px);overflow:auto}
.tr{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:12px 14px;font-size:12.5px;border-bottom:1px solid var(--line, rgba(0,0,0,.06))}
.tr:last-child{border-bottom:0}
.tr .seta{font-size:16px;line-height:1.2;color:var(--accent);font-weight:700}

.envio{padding:12px 14px;border-radius:var(--r-control);font-size:12.5px}
.envio .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

<body>
<div class="wrap" id="app" hidden>
  <header class="topo">
    <div>
      <h1>Edição</h1>
      <p id="resumo">Tarefas do editor e revisão dos vídeos.</p>
    </div>
    <div class="acoes" id="acoes-topo"></div>
  </header>
  <div id="avisos"></div>
  <div id="alerta-prazo"></div>
  <section class="fluxo vidro" aria-label="Etapas das tarefas">
    <p class="tit">Caminho de cada tarefa · toque numa etapa para abrir</p>
    <div class="etapas" id="etapas"></div>
    <p class="volta"><svg class="i" viewBox="0 0 24 24" style="color:var(--e-ajustes);width:13px;height:13px"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Pedir ajustes → volta para Em edição → o editor envia nova versão → volta para Para revisar</p>
  </section>
  <div class="grade">

      <div class="fila-h"><span>Tarefas</span><span id="total">0</span></div>
      <div class="fila-corpo" id="fila"></div>
    </section>
    <section class="detalhe cartao" id="detalhe" aria-live="polite"></section>
  </div>
</div>

<dialog id="dlg-tarefa"><form class="dlg" id="f-tarefa" method="dialog"></form></dialog>
<div class="rev" id="rev" hidden role="dialog" aria-label="Revisão do vídeo"></div>
<dialog id="dlg-link"><div class="dlg" id="link-corpo"></div></dialog>
<div class="envios" id="envios" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<script>
// Estes dois valores são públicos por natureza. Quem protege os dados é o login + as regras do banco.
const SB = supabase.createClient('https://prrqshhnhvehvyafitax.supabase.co', 'sb_publishable_25ymkT18mK9bmAnEo-t5gw_mzYqdUiT');

const COR = id => `var(--e-${id})`;
const ICO = {
  relogio:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  alerta:'<path d="M12 3.5 2.5 20h19z"/><path d="M12 10v4.5M12 17.5v.01"/>',
  a_fazer:'<path d="M9 4.5h6M9 4.5a1.5 1.5 0 0 0-1.5 1.5v.5h9V6A1.5 1.5 0 0 0 15 4.5M7.5 6.5H6a1.5 1.5 0 0 0-1.5 1.5v11A1.5 1.5 0 0 0 6 20.5h12a1.5 1.5 0 0 0 1.5-1.5V8A1.5 1.5 0 0 0 18 6.5h-1.5"/>',
  em_edicao:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  para_revisar:'<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/>',
  ajustes:'<path d="M12 8v5M12 16.5h.01"/><path d="M10.3 3.9 2.6 17.5A2 2 0 0 0 4.3 20.5h15.4a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  reenviado:'<path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/>',
  aprovado:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  chev:'<path d="m9 6 6 6-6 6"/>', mais:'<path d="M12 5v14M5 12h14"/>', pasta:'<path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2.5h7a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/>',
  video:'<rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="M10 9.5v5l4.3-2.5z"/>', imagem:'<rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m20.5 16-5-5-9 8.5"/>',
  arquivo:'<path d="M13.5 3.5H7a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9z"/><path d="M13.5 3.5V9H19"/>', baixar:'<path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/>',
  abrir:'<path d="M14 4.5h5.5V10M19.5 4.5 11 13"/><path d="M18 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10"/>', enviar:'<path d="M12 20V9M7 13.5l5-5 5 5M5 4h14"/>',
  sair:'<path d="M15 4.5h3.5A1.5 1.5 0 0 1 20 6v12a1.5 1.5 0 0 1-1.5 1.5H15M10 16.5 14.5 12 10 7.5M14.5 12H4"/>', voltar:'<path d="m14.5 6-6 6 6 6"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>', lixo:'<path d="M4.5 7h15M10 11v6M14 11v6M6 7l1 12a1.5 1.5 0 0 0 1.5 1.4h7A1.5 1.5 0 0 0 17 19l1-12M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>', drive:'<path d="m8.5 4 7 0 5 8.5-3.5 6h-10l-3.5-6z"/><path d="M8.5 4 12 10M15.5 4 8 16.5M3.5 12.5H17"/>'
};
const ico = (k, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICO[k] || ''}</svg>`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]);
const hojeStr = () => new Date().toLocaleDateString('en-CA', { timeZone: 'America/Bahia' });
const quando = iso => iso ? new Date(iso).toLocaleString('pt-BR', { timeZone: 'America/Bahia', day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }).replace(',', ' às') : '';
const diaMes = iso => iso ? new Date(iso).toLocaleDateString('pt-BR', { timeZone: 'America/Bahia', day:'2-digit', month:'2-digit' }) : '';
const nomeEtapa = id => (ETAPAS.find(e => e.id === id) || {}).nome || id;

let EU = null;          // { papel, nome, email }
let TAREFAS = [];
let sel = null, aba = 'video', versaoVista = null;
const abertas = new Set();
const players = {};     // tarefa → { numero: url assinada }
let rascunhoTempo = null;
let velocidadeP = 1, loopP = false, verAtalhos = false;      // player
let buscaC = '', filtroC = 'todos', todasVersoes = false, respondendo = null; // comentários

// Links do Drive com a conta certa: com várias contas Google no navegador, o Drive usa a primeira
// e o download dá 403. authuser força a conta que tem acesso às pastas.
async function token() { const { data: { session } } = await SB.auth.getSession(); return session?.access_token || ''; }
async function api(caminho, opcoes = {}) {
  const r = await fetch(caminho, { ...opcoes, headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${await token()}`, ...(opcoes.headers || {}) } });
  const dados = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(dados.erro || String(r.status)); e.codigo = dados.erro; e.status = r.status; throw e; }
  return dados;
}
const MSG = {
  drive_desconectado: 'O Google Drive está desconectado.',
  fora_da_raiz: 'Esta pasta está fora da pasta de trabalho.',
  fora_da_casa: 'Esse arquivo não está dentro da pasta desta casa.',
  nao_e_video: 'Escolha um arquivo de vídeo.',
  sem_raiz: 'Falta escolher a pasta de trabalho no Drive.',
  google_editor: 'Conecte sua conta Google (botão no topo) para baixar.',
  r2_nao_configurado: 'O armazenamento de vídeos ainda não foi configurado.',
  r2_nao_chegou: 'O vídeo não chegou ao armazenamento. Tente de novo.',
  tamanho_invalido: 'O vídeo passa de 5 GB.',
  ja_aprovada: 'Esta tarefa já foi aprovada.',
};
function aviso(texto, tom = '') {
  const el = document.getElementById('avisos');
  el.innerHTML = texto ? `<p class="aviso-box ${tom}" role="${tom === 'erro' ? 'alert' : 'status'}">${esc(texto)}</p>` : '';
  if (texto && tom !== 'erro') setTimeout(() => { if (el.textContent.includes(texto)) el.innerHTML = ''; }, 6000);
}

// ------------------------------------------------------------ dados
async function carregarTarefas() {
  const { data, error } = await SB.from('tarefas')
    .select('*, versoes(numero,nome,tamanho,nota,enviada_por,enviada_em,drive_file_id), eventos(tipo,versao,autor,texto,criado_em), comentarios(id,versao,tempo_seg,texto,autor,enviado,criado_em,resposta_a,resolvido,resolvido_por,convidado,pos_x,pos_y)')
    .order('atualizada_em', { ascending: false });
  if (error) { aviso('Não foi possível carregar as tarefas. Confira se a migração do banco já foi rodada.', 'erro'); TAREFAS = []; return; }
  TAREFAS = (data || []).map(t => ({
    ...t,
    versoes: (t.versoes || []).sort((a, b) => a.numero - b.numero),
    eventos: (t.eventos || []).sort((a, b) => a.criado_em < b.criado_em ? -1 : 1),
    comentarios: (t.comentarios || []).sort((a, b) => (a.tempo_seg ?? 1e9) - (b.tempo_seg ?? 1e9) || (a.criado_em < b.criado_em ? -1 : 1)),
  }));
}
const tarefaSel = () => TAREFAS.find(t => t.id === sel) || null;
const etapaT = t => etapaDe(t.status, t.versoes.length);

async function assinaturas(t) {
  if (!t.versoes.length) return;
  for (let tentativa = 0; tentativa < 3; tentativa++) {
    try {
      const { versoes } = await api(`/api/tarefas/versao?tarefa=${t.id}`);
      players[t.id] = Object.fromEntries(versoes.map(v => [v.numero, v.removido ? { removido: v.removido } : v.video]));
      return;
    } catch (e) {
      console.error('Link do vídeo:', e);
      if (e.status === 401 || e.status === 403) break;
      await new Promise(r => setTimeout(r, 800 * (tentativa + 1)));
    }
  }
  players[t.id] = { erro: true }; // mostra "Tentar de novo" em vez de "Carregando…" para sempre
}
// link vencido (vale 6 h) ou falha no player: busca um link novo uma vez
async function renovarVideo(t) {
  if (!t || renovando.has(t.id)) return;
  renovando.add(t.id);
  await assinaturas(t);
  if (sel === t.id) { renderDetalhe(); if (modoRev) renderRevisao(); }
  setTimeout(() => renovando.delete(t.id), 30000);
}
const renovando = new Set();
const semVideoTxt = t => players[t.id]?.erro
  ? `Não foi possível carregar o vídeo.<br><button class="btn peq" type="button" data-act="video-de-novo" style="margin-top:10px">Tentar de novo</button>`
  : 'Carregando o vídeo…';

// ------------------------------------------------------------ topo, etapas e fila
function renderTopo() {
  const para = TAREFAS.filter(t => t.status === 'para_revisar').length;
  document.getElementById('resumo').textContent = TAREFAS.length
    ? `${TAREFAS.length} ${TAREFAS.length === 1 ? 'tarefa' : 'tarefas'} · ${para} para revisar`
    : 'Tarefas do editor e revisão dos vídeos.';
  document.getElementById('acoes-topo').innerHTML = EU.papel === 'dono'
    ? `<a class="btn" href="painel.html">${ico('voltar')} Prospecção</a><button class="btn prim" type="button" data-act="nova">${ico('mais')} Nova tarefa</button>`
    : `<span class="chip" style="background:var(--muted);color:var(--ink)">${esc(EU.nome)}</span><button class="btn" type="button" data-act="sair">${ico('sair')} Sair</button>`;
}

// tarefas não aprovadas com prazo vencido ou vencendo em até 2 dias, da mais urgente para a menos
function renderAlertaPrazo() {
  const hoje = hojeStr();
  const lista = TAREFAS.filter(t => etapaT(t) !== 'aprovado')
    .map(t => ({ t, pr: prazoInfo(t.prazo, hoje) }))
    .filter(x => x.pr && (x.pr.atrasado || x.pr.urgente))
    .sort((a, b) => a.pr.dias - b.pr.dias);
  const el = document.getElementById('alerta-prazo');
  if (!lista.length) { el.innerHTML = ''; return; }
  const atrasadas = lista.filter(x => x.pr.atrasado).length, vencendo = lista.length - atrasadas;
  const titulo = [
    atrasadas ? `${atrasadas} ${atrasadas === 1 ? 'tarefa atrasada' : 'tarefas atrasadas'}` : '',
    vencendo ? `${vencendo} ${vencendo === 1 ? 'tarefa vence' : 'tarefas vencem'} em até 2 dias` : '',
  ].filter(Boolean).join(' · ');
  el.innerHTML = `<div class="alerta-prazo ${atrasadas ? 'atrasado' : ''}" role="alert">${ico('alerta')}
    <div><b>Atenção: ${titulo}</b>
      <ul>${lista.map(({ t, pr }) => `<li><button type="button" data-tarefa="${t.id}">${esc(t.casa_nome)} · ${esc(pr.texto)}</button></li>`).join('')}</ul>
    </div></div>`;
}

function renderEtapas() {
  document.getElementById('etapas').innerHTML = ETAPAS.map((e, i) => {
    const n = TAREFAS.filter(t => etapaT(t) === e.id).length;
    const on = abertas.size === 1 && abertas.has(e.id);
    return (i === ETAPAS.length - 1 ? '<span class="divisor" aria-hidden="true"></span>' : '') +
      `<button class="etapa" type="button" data-etapa="${e.id}" aria-pressed="${on}">
        <span class="bola" style="background:${COR(e.id)}">${ico(e.id)}</span>
        <span style="min-width:0"><b>${e.nome}</b><small>${e.dica}</small></span>
        <span class="n">${n}</span>${i < ETAPAS.length - 2 ? `<span class="seta">${ico('chev')}</span>` : ''}
      </button>`;
  }).join('');
}

function linhaTarefa(t) {
  const etapa = etapaT(t), pr = prazoInfo(t.prazo, hojeStr());
  const ultimoAjuste = [...t.eventos].reverse().find(e => e.tipo === 'ajustes');
  const sub = t.status === 'ajustes' && ultimoAjuste?.texto ? `“${esc(ultimoAjuste.texto)}”`
    : esc(t.tipo);

function abaLinha(t) {
  const enviados = t.comentarios.filter(c => c.enviado);
  const titulo = e => ({ criada: 'Tarefa criada', comecou: 'Edição começou', versao: e.versao > 1 ? `V${e.versao} reenviada com os ajustes` : 'V1 enviada para revisão', ajustes: 'Ajustes pedidos', aprovada: `V${e.versao} aprovada`, status: `Etapa mudada para ${nomeEtapa(e.texto)}` })[e.tipo];
  const etapaEv = e => ({ criada: 'a_fazer', comecou: 'em_edicao', versao: e.versao > 1 ? 'reenviado' : 'para_revisar', ajustes: 'ajustes', aprovada: 'aprovado', status: e.texto })[e.tipo];
  const itens = t.eventos.map(e => {
    const notas = e.tipo === 'ajustes' ? enviados.filter(c => c.versao === e.versao && c.autor !== EU_NOME_EDITOR(t, c)) : [];
    const txt = [e.texto, ...notas.map(c => (c.tempo_seg !== null ? timecode(c.tempo_seg) + ' · ' : '') + c.texto)].filter(Boolean).join('\n');
    return `<li><span class="pt" style="background:${COR(etapaEv(e))}">${ico(etapaEv(e))}</span>
      <div><b>${titulo(e)}</b><p class="m">${quando(e.criado_em)} · ${esc(e.autor)}</p>${txt && !['criada', 'status'].includes(e.tipo) ? `<div class="q">${esc(txt)}</div>` : ''}</div></li>`;
  });
  const esperando = { para_revisar: 'Aguardando a sua revisão', ajustes: 'Aguardando a nova versão do editor', em_edicao: 'Em edição', a_fazer: 'Aguardando o editor começar' }[t.status];
  if (esperando) itens.push(`<li><span class="pt" style="background:none;border:1.5px dashed var(--ink-3)"></span><div><b style="color:var(--ink-2)">${esperando}</b></div></li>`);
  return `<ol class="tl">${itens.join('')}</ol>`;
}
// comentários do pedido de ajustes = os do dono (o editor responde com o próprio nome)
function EU_NOME_EDITOR(t, c) { return t.versoes.find(v => v.numero === c.versao)?.enviada_por; }

let envioSeq = 0;
const ENVIOS = new Map();
// ---- painel de transferências (como o do Cyberduck): tudo que sobe e desce, com velocidade e tempo restante
const FEITAS = [];          // concluídas nesta sessão (até fechar a página)
const AMOSTRAS = new Map(); // chave → amostras de progresso (velocidade)
let painelMin = false, quadroTransf = 0;
const linhaEnvio = e => ({ chave: 'envio' + e.id, tipo: 'up', nome: e.arquivo.name, feito: e.enviado, total: e.total, estado: e.estado === 'enviando' ? 'rodando' : e.estado, fim: e.fim,
  atual: e.estado === 'erro' ? e.erro || 'Falhou' : '', retomar: e.estado === 'erro' ? e.id : 0 });
function arquivar(l) { if (l && l.estado !== 'rodando') FEITAS.unshift({ ...l, chave: 'feita' + FEITAS.length + Date.now(), detalhes: '', repetir: '', retomar: 0, fim: l.fim || new Date() }); }
function renderEnvios() { if (!quadroTransf) quadroTransf = requestAnimationFrame(() => { quadroTransf = 0; desenharTransf(); }); }
setInterval(() => { if (document.querySelector('#envios .tr.rodando')) renderEnvios(); }, 1000); // velocidade e tempo andam mesmo sem evento
function desenharTransf() {
  const el = document.getElementById('envios');
  const ativas = [...ENVIOS.values()].map(linhaEnvio);
  const todas = [...ativas, ...FEITAS];
  if (!todas.length) { el.innerHTML = ''; return; }
  const agora = Date.now();
  for (const l of ativas) { if (l.estado === 'rodando') AMOSTRAS.set(l.chave, amostrar(AMOSTRAS.get(l.chave), agora, l.feito)); else AMOSTRAS.delete(l.chave); }
  const rodando = ativas.filter(l => l.estado === 'rodando');
  if (painelMin) {
    const f = rodando.reduce((n, l) => n + l.feito, 0), t = rodando.reduce((n, l) => n + l.total, 0);
    const sobe = rodando.filter(l => l.tipo === 'up').length, desce = rodando.length - sobe;
    el.innerHTML = `<button class="transf-min cartao" type="button" data-act="transf-min" aria-label="Abrir transferências">
      <b>${rodando.length ? `${sobe ? '↑ ' + sobe : ''}${sobe && desce ? ' · ' : ''}${desce ? '↓ ' + desce : ''}` : 'Transferências'}</b>
      <span class="prog"><i style="width:${t ? Math.floor(f / t * 100) : 100}%"></i></span><span>${rodando.length ? (t ? Math.floor(f / t * 100) : 0) + '%' : 'concluídas'}</span></button>`;
    return;
  }
  const hora = d => new Date(d).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }).replace(',', ' às');
  el.innerHTML = `<div class="cartao transf" role="region" aria-label="Transferências">
    <div class="transf-topo"><b>Transferências</b><span>
      ${todas.some(l => l.estado !== 'rodando') ? '<button class="btn peq" type="button" data-act="transf-limpar">Limpar concluídas</button>' : ''}
      <button class="x" type="button" data-act="transf-min" aria-label="Recolher">–</button></span></div>
    <div class="transf-lista">${todas.map(l => {
      const pct = l.estado === 'feito' ? 100 : l.total ? Math.floor(l.feito / l.total * 100) : 0;
      const texto = l.estado === 'feito' ? `Concluída · ${tamanhoLegivel(l.total)} · ${hora(l.fim)}`
        : l.estado === 'erro' ? `Parou · ${textoProgresso(l.feito, l.total, 0)}`
        : textoProgresso(l.feito, l.total, velocidade(AMOSTRAS.get(l.chave)));
      return `<div class="tr ${l.estado}">
        <span class="seta" aria-label="${l.tipo === 'up' ? 'Envio' : 'Download'}">${l.tipo === 'up' ? '↑' : '↓'}</span>
        <div style="min-width:0"><div class="nm" title="${esc(l.nome)}">${esc(l.nome)}</div>
          <div class="prog"><i style="width:${pct}%"></i></div>
          <div class="lin">${esc(texto)}</div>
          ${l.atual ? `<div class="atual" title="${esc(l.atual)}">${esc(l.atual)}</div>` : ''}</div>
        <div class="bts">${l.parar ? `<button class="btn peq" type="button" data-act="${l.parar}">Parar</button>` : ''}
          ${l.repetir ? `<button class="btn peq prim" type="button" data-act="${l.repetir}">${l.rotuloRepetir || 'Tentar de novo'}</button>` : ''}
          ${l.retomar ? `<button class="btn peq prim" type="button" data-retomar="${l.retomar}">Tentar de novo</button>` : ''}
          ${l.detalhes ? `<button class="btn peq" type="button" data-act="${l.detalhes}">Detalhes</button>` : ''}</div>
      </div>`;
    }).join('')}</div></div>`;
}
// ------------------------------------------------------------ versão de aprovação no R2 (não vai para o Drive)
async function enviarVersaoR2(t, arquivo, nota) {
  const e = { id: ++envioSeq, arquivo, total: arquivo.size, enviado: 0, estado: 'enviando', r2: { tarefa: t.id, chave: null, enviado: false, nota } };
  ENVIOS.set(e.id, e); renderEnvios();
  await continuarR2(e);
}
/** Envia (se ainda não foi) e registra a versão. "Tentar de novo" volta aqui: o que já chegou não é reenviado. */
async function continuarR2(e) {
  e.estado = 'enviando'; e.erro = ''; renderEnvios();
  try {
    if (!e.r2.enviado) {
      const tipo = e.arquivo.type || 'video/mp4';
      const { url, chave } = await api('/api/r2/envio', { method: 'POST', body: JSON.stringify({ tarefa: e.r2.tarefa, nome: e.arquivo.name, tipo, tamanho: e.arquivo.size }) });
      e.r2.chave = chave; e.enviado = 0;
      const st = await new Promise(ok => {
        const x = new XMLHttpRequest(); e.xhr = x;

}
function atualizarTempoRev() {
  const p = document.getElementById('player'), el = document.getElementById('rev-tempo'); if (!p || !el) return;
  el.textContent = `${timecode(p.currentTime)} / ${timecode(p.duration || 0)}`;
  const b = document.getElementById('bt-tocar'); if (b) b.textContent = p.paused ? '▶' : '❚❚';
}
['play', 'pause', 'seeked', 'loadedmetadata', 'timeupdate'].forEach(ev => document.addEventListener(ev, e => {
  if (e.target.id !== 'player' || !modoRev) return;
  atualizarTempoRev();
  if (ev !== 'timeupdate') desenharPinos();
}, true));
window.addEventListener('resize', () => { if (modoRev) desenharPinos(); });

// clicar no vídeo: pausa, marca o ponto e abre o comentário naquele segundo
document.addEventListener('click', e => {
  if (!modoRev || e.target.id !== 'player') return;
  const p = e.target, a = areaImagem(p), r = p.getBoundingClientRect();
  p.pause();
  if (a) {
    const x = (e.clientX - r.left - (a.x - p.offsetLeft)) / a.w, y = (e.clientY - r.top - (a.y - p.offsetTop)) / a.h;
    rascunhoPos = x >= 0 && x <= 1 && y >= 0 && y <= 1 ? { x: Math.round(x * 1000) / 1000, y: Math.round(y * 1000) / 1000 } : null;
  }
  rascunhoTempo = p.currentTime;
  const tc = document.getElementById('tc-atual'); if (tc) tc.textContent = timecode(rascunhoTempo);
  const dica = document.querySelector('.rev-dica'); if (dica) dica.textContent = (rascunhoPos ? '● Ponto marcado na imagem. ' : '') + 'Clique no vídeo para marcar o ponto e comentar.';
  desenharPinos();
  const i = document.getElementById('txt-coment');
  if (i) i.focus({ preventScroll: false }); else aviso(tarefaSel()?.status === 'aprovado' ? 'Este vídeo já foi aprovado.' : 'Só dá para comentar na versão atual.', 'erro');
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-ver-c]'); if (!b) return;
  const li = document.querySelector(`[data-cid="${b.dataset.verC}"]`);
  if (li) { li.scrollIntoView({ block: 'center', behavior: 'smooth' }); li.classList.add('foco'); setTimeout(() => li.classList.remove('foco'), 1400); }
});
document.addEventListener('change', e => {
  if (e.target.id !== 'rev-versao') return;
  versaoVista = Number(e.target.value); rascunhoPos = null; rascunhoTempo = null; renderRevisao();
});

// ---- link de revisão do cliente
async function abrirLinks() {
  const t = tarefaSel(), dlg = document.getElementById('dlg-link'), el = document.getElementById('link-corpo');
  el.innerHTML = '<p class="dica">Carregando…</p>'; if (!dlg.open) dlg.showModal();
  const { data, error } = await SB.from('links_revisao').select('token,expira_em,criado_em').eq('tarefa_id', t.id).order('criado_em', { ascending: false });
  const links = error ? [] : data;
  el.innerHTML = `<h3>Link para o cliente</h3>
    <p class="dica">Quem tiver o link vê os vídeos de ${esc(t.casa_nome)} e comenta nos minutos, sem login. Os comentários chegam para você como rascunho; você decide se manda para o editor.</p>
    ${error ? '<p class="aviso-box erro">Não foi possível ler os links. Confira se a migração 20261124_revisao.sql já foi rodada.</p>' : ''}
    ${links.length ? `<ul class="links">${links.map(l => { const v = validadeLink(l.expira_em); const u = `${location.origin}/revisao.html?t=${l.token}`;
      return `<li class="${v.ativo ? '' : 'exp'}"><input class="campo" readonly value="${esc(u)}" aria-label="Link"><small>${v.texto} · criado em ${diaMes(l.criado_em)}</small>
        <span class="acoes">${v.ativo ? `<button class="btn peq" type="button" data-copiar="${esc(u)}">Copiar</button>` : ''}<button class="btn peq" type="button" data-link-apagar="${l.token}">${ico('lixo')} Desativar</button></span></li>`; }).join('')}</ul>` : '<p class="dica">Nenhum link criado ainda.</p>'}
    <div class="acoes" style="margin-top:12px">
      <select class="campo" id="link-dias" aria-label="Validade" style="max-width:160px">${[3, 7, 15, 30].map(d => `<option value="${d}" ${d === 7 ? 'selected' : ''}>Vale ${d} dias</option>`).join('')}</select>
      <button class="btn prim" type="button" data-act="link-criar">Criar link</button>
      <button class="btn" type="button" data-act="link-fechar">Fechar</button>
    </div>`;
}
async function criarLink() {
  const t = tarefaSel(), dias = Number(document.getElementById('link-dias').value) || 7;
  const { data, error } = await SB.from('links_revisao').insert({ tarefa_id: t.id, expira_em: new Date(Date.now() + dias * 86400000).toISOString(), criado_por: EU.nome || 'Cainan' }).select('token').single();
  if (error) return aviso('Não foi possível criar o link.', 'erro');
  const u = `${location.origin}/revisao.html?t=${data.token}`;
  await abrirLinks();
  // a cópia pode ficar esperando permissão do navegador: não segura a tela
  Promise.resolve(navigator.clipboard?.writeText(u)).then(() => aviso('Link criado e copiado.', 'ok'), () => aviso('Link criado. Use “Copiar”.', 'ok'));
}
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-copiar],[data-link-apagar],[data-responder],[data-resolver],[data-player],[data-vel]'); if (!b) return;
  const d = b.dataset;
  if (d.copiar) { b.closest('li')?.querySelector('input')?.select(); Promise.resolve(navigator.clipboard?.writeText(d.copiar)).then(() => { b.textContent = 'Copiado'; }, () => { b.textContent = 'Selecionado: Cmd+C'; }); return; }
  if (d.linkApagar) {
    if (!confirm('Desativar este link? Quem tiver o endereço não consegue mais abrir. Os comentários já feitos ficam.')) return;
    const { error } = await SB.from('links_revisao').delete().eq('token', d.linkApagar);
    if (error) aviso('Não foi possível desativar o link.', 'erro');
    return abrirLinks();
  }
  if (d.responder !== undefined) { respondendo = Number(d.responder) || null; renderDetalhe(); document.getElementById('txt-resp')?.focus(); return; }
  if (d.resolver) return rpc('resolver_comentario', { p_comentario: Number(d.resolver), p_resolvido: d.valor === '1' });
  if (d.player) return controlePlayer(d.player);
  if (d.vel) {
    velocidadeP = Number(d.vel); const p = document.getElementById('player'); if (p) p.playbackRate = velocidadeP;
    document.querySelectorAll('[data-vel]').forEach(x => x.setAttribute('aria-pressed', String(Number(x.dataset.vel) === velocidadeP)));
  }
});
document.addEventListener('submit', async e => {
  if (!e.target.matches('.form-resp')) return;
  e.preventDefault();
  const txt = document.getElementById('txt-resp').value.trim(); if (!txt) return;
  const id = Number(e.target.dataset.resp); respondendo = null;
  await rpc('responder', { p_comentario: id, p_texto: txt });
});
document.addEventListener('change', async e => {
  if (e.target.id === 'filtro-c') { filtroC = e.target.value; return aplicarFiltroC(); }
  if (e.target.id === 'todas-c') { todasVersoes = e.target.checked; return renderDetalhe(); }
  if (e.target.id === 'mudar-etapa') {
    const v = e.target.value; e.target.value = '';
    return mudarEtapa(tarefaSel(), v);
  }
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-status]');
  if (b && b.getAttribute('aria-pressed') !== 'true') mudarEtapa(tarefaSel(), b.dataset.status);
});
async function mudarEtapa(t, v) {
    if (!t || !v || t.status === v) return;
    if (v === 'aprovado') { if (confirm(`Aprovar a V${t.versoes.at(-1)?.numero} de ${t.casa_nome}?`)) return rpc('aprovar_tarefa', { p_tarefa: t.id }, 'Vídeo aprovado.'); return; }
    if (t.status === 'aprovado' && !confirm(`Reabrir ${t.casa_nome}? Ela sai de aprovada e o vídeo não é mais apagado em 1 mês.`)) return;
    const ok = await rpc('mudar_status', { p_tarefa: t.id, p_status: v }, `Etapa mudada para ${nomeEtapa(v)}.`);
    if (!ok) aviso('Não foi possível mudar a etapa (para revisar e ajustes precisam de uma versão).', 'erro');
}

// ------------------------------------------------------------ nova tarefa
async function abrirNovaTarefa() {
  const dlg = document.getElementById('dlg-tarefa'), f = document.getElementById('f-tarefa');
  f.innerHTML = `<h2>Nova tarefa</h2>
    <label>Casa<input class="campo" id="busca-casa" placeholder="Buscar casa no Drive" autocomplete="off"></label>
    <div class="lista-casas" id="lista-casas"><p class="carregando">Carregando as casas do Drive…</p></div>
    <input type="hidden" id="casa-escolhida">
    <div class="dois">
      <label>Tipo<select class="campo" id="t-tipo">${['Reels', 'Pílula', 'Tour', 'Carrossel', 'Outro'].map(x => `<option>${x}</option>`).join('')}</select></label>
      <label>Prazo<input class="campo" type="date" id="t-prazo"></label>
    </div>
    <label>Instruções para o editor<textarea class="campo" id="t-instr" placeholder="Ex.: Reels de 30 s, abrir com o drone da piscina, música calma"></textarea></label>
    <p class="dica" id="t-erro" role="alert" style="color:var(--danger)"></p>
    <div class="acoes" style="justify-content:flex-end"><button class="btn" type="button" onclick="this.closest('dialog').close()">Cancelar</button><button class="btn prim" type="submit">Criar tarefa</button></div>`;
  dlg.showModal();
  const lista = document.getElementById('lista-casas'), busca = document.getElementById('busca-casa'), escolhida = document.getElementById('casa-escolhida');
  // escolher uma pasta da lista
  lista.onclick = ev => {
    const b = ev.target.closest('[data-casa]'); if (!b) return;
    lista.querySelectorAll('[data-casa]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    escolhida.value = JSON.stringify({ id: b.dataset.casa, nome: b.dataset.nome });
    document.getElementById('t-erro').textContent = '';
  };
  try {
    const estado = await api('/api/drive/estado');
    if (!estado.conectado || !estado.raiz) throw { codigo: estado.conectado ? 'sem_raiz' : 'drive_desconectado' };
    busca.placeholder = `Buscar casa em ${estado.raiz.nome}`;
    const { itens } = await api(`/api/drive?pasta=${encodeURIComponent(estado.raiz.id)}`);
    const casas = itens.filter(i => i.tipo === 'pasta').sort((x, y) => x.nome.localeCompare(y.nome, 'pt-BR', { numeric: true }));
    const pintar = filtro => {
      const n = semAcentoBusca(filtro), atual = escolhida.value && JSON.parse(escolhida.value).id;
      const vis = casas.filter(c => semAcentoBusca(c.nome).includes(n));
      lista.innerHTML = vis.length
        ? vis.map(c => `<button type="button" data-casa="${esc(c.id)}" data-nome="${esc(c.nome)}" aria-pressed="${c.id === atual}">${ico('pasta')} ${esc(c.nome)}</button>`).join('')
        : '<p class="carregando">Nenhuma pasta encontrada.</p>';
    };
    pintar('');
    busca.oninput = ev => pintar(ev.target.value);
    busca.focus();
  } catch (err) {
    // sem Drive: escreve o nome da casa à mão
    lista.hidden = true;
    busca.placeholder = 'Ex.: 09 Casa 11 Lia - QD';
    busca.insertAdjacentHTML('afterend', `<span class="dica" style="display:block;margin-top:4px">${esc(err.codigo === 'sem_raiz' ? 'O Drive está conectado, mas sem pasta de trabalho.' : MSG[err.codigo] || 'Não foi possível abrir o Drive.')} Escreva o nome da casa.</span>`);
    busca.focus();
  }
}
const semAcentoBusca = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
async function salvarTarefa() {
  const erro = document.getElementById('t-erro'), escolhida = document.getElementById('casa-escolhida').value;
  const comDrive = !document.getElementById('lista-casas').hidden;
  const casa = escolhida ? JSON.parse(escolhida) : comDrive ? null : { id: null, nome: document.getElementById('busca-casa').value.trim() };
  if (!casa?.nome) { erro.textContent = comDrive ? 'Escolha a pasta da casa na lista.' : 'Escreva o nome da casa.'; return; }
  const { data, error } = await SB.from('tarefas').insert({
    casa_nome: casa.nome, casa_pasta_id: casa.id, tipo: document.getElementById('t-tipo').value,
    prazo: document.getElementById('t-prazo').value || null, instrucoes: document.getElementById('t-instr').value.trim(),
  }).select('id').single();
  if (error) { erro.textContent = 'Não foi possível criar a tarefa.'; return; }
  document.getElementById('dlg-tarefa').close();
  sel = data.id; abertas.add('a_fazer'); aba = 'video';
  aviso('Tarefa criada.', 'ok');
  await recarregar();
}

// ---- atalho do Cyberduck (.duck): abre a pasta da casa no Google Drive, no Cyberduck do editor
// No Cyberduck, o que foi compartilhado com a pessoa fica em "/Shared with me"; o que é dela, em "/My Drive".
// A pasta compartilhada com o editor é BAHIA HOMES (Casas fica dentro dela). Em "Shared with me"
// só aparece a pasta de cima do compartilhamento, então o caminho passa por BAHIA HOMES.
const CYBERDUCK_BASE = { editor: '/Shared with me/BAHIA HOMES', dono: '/My Drive/BAHIA HOMES' };
const xml = v => String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
async function baixarDuck(t) {
  let estado = null;
  try { estado = await api('/api/drive/estado'); } catch { /* sem servidor: usa o nome padrão da pasta */ }
  const raiz = estado?.raiz?.nome || 'Casas';
  // Sem a conta no atalho, o Cyberduck pede login no navegador toda vez e pode abrir na raiz.
  // Editor: a conta Google ligada antes (drive_editor) ou, se não houver, o e-mail com que entra no site.
  const emailSite = (await SB.auth.getSession()).data.session?.user?.email || null;
  const conta = EU.papel === 'editor' ? (estado?.google_editor?.email || emailSite) : (estado?.email || emailSite);
  const caminho = `${CYBERDUCK_BASE[EU.papel] || CYBERDUCK_BASE.editor}/${raiz}/${t.casa_nome}`;
  const campos = { Protocol: 'googledrive', Provider: 'iterate GmbH', UUID: crypto.randomUUID(), Hostname: 'www.googleapis.com', Port: '443',
    ...(conta ? { Username: conta } : {}), Path: caminho, Nickname: `${t.casa_nome} · ${t.tipo}` };
  const corpo = `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
${Object.entries(campos).map(([k, v]) => `\t<key>${k}</key>\n\t<string>${xml(v)}</string>`).join('\n')}
</dict>
</plist>
`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([corpo], { type: 'application/octet-stream' }));
  a.download = `${t.casa_nome.replace(/[\\/:*?"<>|]/g, '-').trim()}.duck`;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

// ------------------------------------------------------------ início
async function iniciar() {
  const { data: { session } } = await SB.auth.getSession();
  if (!session) return location.replace('painel.html');
  const papel = await SB.rpc('papel');
  if (papel.error || !['dono', 'editor'].includes(papel.data)) { await SB.auth.signOut(); return location.replace('painel.html'); }
  let nome = 'Cainan';
  if (papel.data === 'editor') {
    const { data } = await SB.from('editores').select('nome').eq('user_id', session.user.id).maybeSingle();
    nome = data?.nome || 'Editor';
  }
  EU = { papel: papel.data, nome, email: session.user?.email };
  document.getElementById('app').hidden = false;
  await recarregar();
}
addEventListener('focus', () => { if (EU) recarregar(); });
iniciar();
