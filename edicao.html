<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Edição · Daime Filmes</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{
  --canvas:#eff5f7; --surface:#fbfdfe; --muted:#eaf3f6; --ink:#18323a; --ink-2:#5b7179; --ink-3:#8fa1a7;
  --line:#d8e6ea; --hover:rgb(24 50 58 / .05); --accent:#087a8a; --accent-hover:#066672; --accent-soft:rgb(8 122 138 / .1);
  --e-a_fazer:#5d6f86; --e-em_edicao:#2f7fb5; --e-para_revisar:#087a8a; --e-ajustes:#c27c0e; --e-reenviado:#7b5cd6; --e-aprovado:#2f9a5b;
  --ok:#17633b; --ok-soft:#eaf6ee; --warn:#825310; --warn-soft:#fff5dc; --danger:#a52626; --danger-soft:#fff0ef;
  --r-panel:1.25rem; --r-control:.875rem;
  --shadow:0 1px 2px rgb(24 50 58 / .04), 0 10px 30px rgb(24 50 58 / .06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100dvh;background:radial-gradient(1100px 520px at 12% -10%, rgb(8 122 138 / .10), transparent), var(--canvas);color:var(--ink);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
a{color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 18px 60px}
.cartao{background:rgb(251 253 254 / .9);border:1px solid var(--line);border-radius:var(--r-panel);box-shadow:var(--shadow)}
.vidro{background:rgb(251 253 254 / .66);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgb(255 255 255 / .7);border-radius:var(--r-panel);box-shadow:var(--shadow)}
@media (prefers-reduced-transparency: reduce){.vidro{background:var(--surface);backdrop-filter:none}}

/* topo */
.topo{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin:8px 0 18px}
.topo h1{margin:0;font-size:32px;line-height:1.1;letter-spacing:-.025em;font-weight:700}
.topo p{margin:6px 0 0;color:var(--ink-2);font-size:15px}
.acoes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:rgb(255 255 255 / .8);font-size:13px;font-weight:600;transition:background-color .15s, transform .1s}
.btn:hover{background:var(--muted)}
.btn:active{transform:scale(.97)}
.btn.prim{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.prim:hover{background:var(--accent-hover)}
.btn.aviso{background:var(--warn-soft);border-color:#f0d99f;color:var(--warn)}
.btn.peq{min-height:32px;padding:0 12px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:5px 11px;background:var(--ok-soft);color:var(--ok)}
.chip.off{background:var(--warn-soft);color:var(--warn)}
.aviso-box{margin:0 0 14px;padding:12px 14px;border-radius:var(--r-control);border:1px solid var(--line);background:var(--surface);font-size:13px}
.aviso-box.erro{border-color:#f0c4c0;background:var(--danger-soft);color:var(--danger)}
.aviso-box.ok{border-color:#b8ddc4;background:var(--ok-soft);color:var(--ok)}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* linha do tempo das etapas */
.fluxo{padding:14px 14px 10px;margin-bottom:16px}
.fluxo .tit{margin:0 4px 10px;font-size:12px;font-weight:600;color:var(--ink-2)}
.etapas{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
@media (min-width:720px){.etapas{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1100px){.etapas{grid-template-columns:1fr 1fr 1fr 1fr 1fr 1px 1fr;align-items:stretch;gap:8px}}
.etapa{position:relative;display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 10px;border:0;border-radius:var(--r-control);background:none;text-align:left;transition:background-color .15s, transform .1s}
.etapa:hover{background:var(--hover)}
.etapa:active{transform:scale(.97)}
.etapa[aria-pressed=true]{background:var(--accent-soft);box-shadow:inset 0 0 0 1px rgb(8 122 138 / .35)}
.etapa .bola{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.etapa .bola svg{width:15px;height:15px;stroke-width:2.3}
.etapa b{display:block;font-size:13px;line-height:1.2}
.etapa small{display:block;font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.etapa .n{margin-left:auto;font-size:12px;font-weight:600;color:var(--ink-2);background:var(--muted);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
.etapa .seta{position:absolute;right:-10px;top:50%;transform:translateY(-50%);color:var(--ink-3);display:none}
@media (min-width:1100px){.etapa .seta{display:block}}
.divisor{display:none}
@media (min-width:1100px){.divisor{display:block;background:var(--line);align-self:center;height:70%}}
.volta{margin:8px 4px 0;font-size:11.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px}

/* fila + detalhe */
.grade{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:1100px){.grade{grid-template-columns:minmax(19rem,.8fr) minmax(0,1.7fr)}}
.fila{overflow:hidden;align-self:start}
.fila-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-2)}
.fila-h span:last-child{background:var(--muted);color:var(--ink);font-size:10px;border-radius:999px;padding:3px 9px}
.fila-corpo{max-height:680px;overflow:auto}
.grupo{border-bottom:1px solid var(--line)}
.grupo:last-child{border-bottom:0}
.grupo>h3{margin:0}
.grupo-bt{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:0 16px;border:0;background:rgb(251 253 254 / .9);backdrop-filter:blur(16px);font-size:13px;font-weight:600;text-align:left}
.grupo-bt:hover{background:var(--muted)}
.grupo-bt .chev{color:var(--ink-3);transition:transform .2s cubic-bezier(.23,1,.32,1)}
.grupo-bt[aria-expanded=true] .chev{transform:rotate(90deg)}
.grupo-bt .pt{width:8px;height:8px;border-radius:50%}
.grupo-bt .n{margin-left:auto;color:var(--ink-2);font-variant-numeric:tabular-nums}
.grupo-c{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.23,1,.32,1)}
.grupo-c.aberto{grid-template-rows:1fr}
.grupo-c>div{overflow:hidden}
.grupo-c.aberto>div{padding:0 6px 6px}
.vazio-g{padding:2px 12px 10px;font-size:12px;color:var(--ink-2)}
@media (prefers-reduced-motion: reduce){.grupo-c,.grupo-bt .chev{transition:none}}
.linha{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;width:100%;padding:8px;border:0;border-radius:var(--r-control);background:none;text-align:left}
.linha:hover{background:var(--hover)}
.linha[aria-pressed=true]{background:var(--accent);color:#fff}
.linha[aria-pressed=true] .sub,.linha[aria-pressed=true] .data{color:rgb(255 255 255 / .82)}
.linha[aria-pressed=true] .v{background:rgb(255 255 255 / .22);color:#fff}
.mini{width:44px;height:44px;border-radius:.65rem;display:grid;place-items:center;color:#fff}
.mini svg{width:18px;height:18px}
.nome{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{display:flex;gap:6px;align-items:center;margin-top:2px;font-size:11.5px;color:var(--ink-2);min-width:0}
.sub span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub .atrasado{color:var(--danger);font-weight:600}
.v{font-size:10px;font-weight:700;background:var(--muted);color:var(--ink);border-radius:4px;padding:0 4px;flex:none}
.barras{display:flex;gap:2px;margin-top:5px}
.barras i{display:block;width:14px;height:3px;border-radius:2px}
.data{align-self:start;padding-top:2px;font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}

.detalhe{padding:18px;min-height:460px}
@media (min-width:720px){.detalhe{padding:24px}}
.det-vazio{display:grid;place-items:center;min-height:400px;text-align:center;color:var(--ink-2);font-size:13px}
.det-topo{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-start;padding-bottom:14px;border-bottom:1px solid var(--line)}
.selo{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;border-radius:999px;padding:3px 10px}
.selo .pt{width:6px;height:6px;border-radius:50%}
.det-topo h2{margin:8px 0 2px;font-size:22px;letter-spacing:-.02em}
.det-topo .meta{font-size:12.5px;color:var(--ink-2)}
.instr{margin:14px 0 0;padding:12px 14px;border-radius:var(--r-control);background:var(--muted);font-size:13px;white-space:pre-line}
.abas{display:flex;gap:4px;margin:16px 0;padding:3px;border-radius:var(--r-control);background:var(--muted);width:fit-content}
.abas button{border:0;background:none;padding:7px 14px;border-radius:.65rem;font-size:13px;font-weight:600;color:var(--ink-2)}
.abas button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .1)}
.video-grade{display:grid;gap:18px}
@media (min-width:900px){.video-grade{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}}
.player{background:#0c1d22;border-radius:var(--r-panel);overflow:hidden;display:grid;place-items:center;min-height:240px;max-height:520px}
.player video{width:100%;max-height:520px;display:block;background:#000}
.player .sem{color:rgb(255 255 255 / .7);font-size:13px;padding:30px;text-align:center}
.versoes{display:flex;gap:4px;margin-top:8px;padding:3px;border-radius:var(--r-control);background:var(--muted)}
.versoes button{flex:1;border:0;background:none;min-height:30px;border-radius:.6rem;font-size:12px;font-weight:600;color:var(--ink-2)}
.versoes button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .1)}
h4{margin:0 0 8px;font-size:13px;color:var(--ink-2)}
.coments{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.coment{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;padding:9px 10px;border-radius:var(--r-control);background:var(--surface);border:1px solid var(--line);font-size:13px}
.coment.rasc{border-style:dashed;background:var(--warn-soft)}
.tc{border:0;border-radius:6px;padding:1px 7px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12px;font-variant-numeric:tabular-nums}
.coment small{display:block;color:var(--ink-2);font-size:11px;margin-top:2px}
.x{border:0;background:none;color:var(--ink-3);padding:2px}
.x:hover{color:var(--danger)}
.campo{width:100%;min-height:40px;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r-control);background:var(--surface);font-size:13px}
textarea.campo{resize:vertical;min-height:70px}
.form-coment{display:grid;grid-template-columns:auto 1fr auto;gap:6px;margin-top:8px}
.coment.resolv{opacity:.62}
.coment.resolv > .c-corpo > span:first-child{text-decoration:line-through;text-decoration-color:var(--ink-3)}
.c-corpo{min-width:0;display:grid;gap:6px}
.c-acoes{display:flex;gap:12px}
.c-acoes button{border:0;background:none;padding:0;font-size:11px;font-weight:600;color:var(--accent)}
.resp{display:flex;gap:6px;align-items:start;justify-content:space-between;padding:6px 8px;border-left:2px solid var(--line);background:var(--muted);border-radius:0 6px 6px 0}
.resp.rasc{border-left-style:dashed}
.form-resp{display:grid;grid-template-columns:1fr auto auto;gap:6px}
.vtag{font-size:10px;font-weight:700;color:var(--ink-2);background:var(--muted);border-radius:4px;padding:0 5px}
.c-topo{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.c-topo h4{margin:0}
.c-filtros{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.c-filtros .campo{min-height:32px;padding:4px 10px;font-size:12px;width:auto}
.c-filtros input[type=search]{width:130px}
.chk{display:flex;gap:5px;align-items:center;font-size:12px;color:var(--ink-2)}
.marcas{position:relative;height:18px;margin-top:8px;border-radius:999px;background:var(--muted);cursor:pointer}
.marcas .cabeca{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--ink);border-radius:2px;pointer-events:none;left:0}
.marca{position:absolute;top:50%;transform:translate(-50%,-50%);min-width:14px;height:14px;padding:0 3px;border-radius:999px;border:2px solid var(--surface);background:var(--e-ajustes);color:#fff;font-size:9px;font-weight:700;line-height:10px}
.marca.ok{background:var(--e-aprovado)}
.marca:hover{transform:translate(-50%,-50%) scale(1.25)}
.ferr{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:8px}
.ferr button{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:30px;padding:0 9px;font-size:12px;font-weight:600;color:var(--ink-2)}
.ferr button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.ferr .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
.ferr .dir{margin-left:auto}
.etapa-sel{min-height:32px;padding:4px 10px;font-size:12px;width:auto;border-radius:999px}
.links{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.links li{display:grid;gap:4px;padding:10px;border:1px solid var(--line);border-radius:var(--r-control)}
.links li.exp{opacity:.55}
.links small{color:var(--ink-2);font-size:11px}
.caixa{margin-top:14px;padding:14px;border-radius:var(--r-panel);border:1px solid var(--line);background:rgb(255 255 255 / .6)}
.caixa .acoes{margin-top:10px}
.dica{font-size:12px;color:var(--ink-2);margin:6px 0 0}

/* arquivos */
.migalhas{display:flex;flex-wrap:wrap;align-items:center;gap:2px;font-size:13px;margin-bottom:10px}
.migalhas button{border:0;background:none;padding:4px 6px;border-radius:6px;color:var(--ink-2);font-weight:600}
.migalhas button:hover{background:var(--hover);color:var(--ink)}
.migalhas span{color:var(--ink-3)}
.arq-barra{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-bottom:10px}
.arquivos{border:1px solid var(--line);border-radius:var(--r-panel);overflow:hidden;background:var(--surface)}
.arq{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);font-size:13px}
.arq:first-child{border-top:0}
.arq:nth-child(even){background:rgb(234 243 246 / .45)}
.arq .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arq button.nm{border:0;background:none;text-align:left;font-weight:600;padding:0}
.arq button.nm:hover{color:var(--accent)}
.arq .info{color:var(--ink-2);font-size:11.5px;font-variant-numeric:tabular-nums}
.arq .bts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.arq .ic{color:var(--ink-2)}
.arq .ic.pasta{color:#3a8fd6}
.arq .ic.video{color:var(--e-reenviado)}
.arq-vazio{padding:22px;text-align:center;color:var(--ink-2);font-size:13px}

/* linha do tempo da tarefa */
.tl{list-style:none;margin:0;padding:4px 14px;border:1px solid var(--line);border-radius:var(--r-panel);background:var(--surface)}
.tl li{position:relative;display:grid;grid-template-columns:20px 1fr;gap:10px;padding:10px 0}
.tl li:not(:last-child)::after{content:"";position:absolute;left:9px;top:32px;bottom:-4px;width:1.5px;background:var(--line)}
.tl .pt{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;margin-top:1px}
.tl .pt svg{width:11px;height:11px;stroke-width:2.8}
.tl b{font-size:13px}
.tl .q{margin-top:6px;padding:8px 10px;border-radius:.7rem;background:var(--warn-soft);font-size:12.5px;white-space:pre-line}
.tl .m{font-size:11.5px;color:var(--ink-2);margin-top:1px}

/* diálogos e envios */
dialog{border:0;padding:0;border-radius:var(--r-panel);box-shadow:0 30px 80px rgb(24 50 58 / .3);width:min(560px,calc(100vw - 24px));color:var(--ink);background:var(--surface)}
dialog::backdrop{background:rgb(24 50 58 / .35);backdrop-filter:blur(3px)}
.dlg{padding:20px;display:grid;gap:12px}
.dlg h2{margin:0;font-size:18px}
.dlg label{font-size:12px;font-weight:600;display:grid;gap:5px}
.lista-casas{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-control)}
.lista-casas button{display:flex;align-items:center;gap:8px;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:9px 12px;text-align:left;font-size:13px}
.lista-casas button:first-child{border-top:0}
.lista-casas button:hover{background:var(--hover)}
.lista-casas button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.dois{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.subidos summary{cursor:pointer;font-weight:600;font-size:13px}
.subidos ul{list-style:none;margin:8px 0 0;padding:0;max-height:220px;overflow:auto;display:grid;gap:4px}
.subidos li{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;min-width:0}
.subidos li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.subidos li .dica{margin:0;white-space:nowrap}
.envios{position:fixed;right:16px;bottom:16px;z-index:50;width:min(420px,calc(100vw - 32px))}
.transf{padding:0;overflow:hidden}
.transf-topo{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line, rgba(0,0,0,.08));font-size:13px}
.transf-topo span{display:flex;gap:6px;align-items:center}
.transf-lista{max-height:min(50vh,420px);overflow:auto}
.tr{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:12px 14px;font-size:12.5px;border-bottom:1px solid var(--line, rgba(0,0,0,.06))}
.tr:last-child{border-bottom:0}
.tr .seta{font-size:16px;line-height:1.2;color:var(--accent);font-weight:700}
.tr.feito .seta{color:var(--e-aprovado)} .tr.erro .seta{color:var(--danger)}
.tr .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .lin{margin-top:6px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tr .atual{margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;color:var(--ink)}
.tr.erro .prog i{background:var(--danger)} .tr.feito .prog i{background:var(--e-aprovado)}
.tr .bts{display:grid;gap:6px;justify-items:end}
.transf-min{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;font-size:12.5px;cursor:pointer;border:0;text-align:left}
.transf-min .prog{flex:1;margin:0}
.envio{padding:12px 14px;border-radius:var(--r-control);font-size:12.5px}
.envio .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:5px;border-radius:3px;background:var(--muted);margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .2s}
.envio .lin{display:flex;justify-content:space-between;gap:8px;margin-top:6px;color:var(--ink-2)}
.envio.erro .prog i{background:var(--danger)}
.envio.feito .prog i{background:var(--e-aprovado)}
.carregando{color:var(--ink-2);font-size:13px;padding:20px;text-align:center}
</style>
</head>
<body>
<div class="wrap" id="app" hidden>
  <header class="topo">
    <div>
      <h1>Edição</h1>
      <p id="resumo">Tarefas do editor, arquivos das casas e revisão dos vídeos.</p>
    </div>
    <div class="acoes" id="acoes-topo"></div>

// Cada arquivo vai num único PUT contínuo; se a conexão cair, pergunta ao Google onde parou e continua dali.
const SIMULTANEOS = 3;
const espera = ms => new Promise(r => setTimeout(r, ms));
/** Roda fn(item) com no máximo n ao mesmo tempo; termina quando todos terminam. */
async function emParalelo(itens, fn, n = SIMULTANEOS) {
  const fila = [...itens];
  const trabalhar = async () => { while (fila.length) await fn(fila.shift()); };
  await Promise.all(Array.from({ length: Math.min(n, fila.length) }, trabalhar));
}
/** Um PUT na sessão de envio. Corpo vazio + "bytes * /total" pergunta onde parou. Resolve { status, range, json }; status 0 = rede caiu. */
function putEnvio(e, inicio, perguntar = false) {
  return new Promise(resolve => {
    const xhr = new XMLHttpRequest();
    e.xhr = xhr;
    xhr.open('PUT', e.url);
    xhr.setRequestHeader('Content-Range', perguntar ? `bytes */${e.total}` : `bytes ${inicio}-${e.total - 1}/${e.total}`);
    if (!perguntar) xhr.upload.onprogress = ev => { e.enviado = inicio + ev.loaded; renderEnvios(); e.aoProgredir?.(); };
    xhr.onload = () => { let json = null; try { json = JSON.parse(xhr.responseText); } catch {} resolve({ status: xhr.status, range: xhr.getResponseHeader('Range'), json }); };
    xhr.onerror = xhr.onabort = xhr.ontimeout = () => resolve({ status: 0, range: null, json: null });
    xhr.send(perguntar ? null : e.arquivo.slice(inicio));
  });
}

async function enviarArquivo(arquivo, destino) {
  const e = { id: ++envioSeq, arquivo, destino, total: arquivo.size, enviado: 0, estado: 'enviando', url: null, resultado: null };
  ENVIOS.set(e.id, e); renderEnvios();
  await continuarEnvio(e);
  return e;
}
async function continuarEnvio(e) {
  e.estado = 'enviando'; e.erro = ''; renderEnvios();
  try {
    if (!e.url) {
      const { url } = await api('/api/drive/envio', { method: 'POST', body: JSON.stringify({ ...e.destino, nome: e.arquivo.name, tipo: e.arquivo.type || 'application/octet-stream', tamanho: e.arquivo.size }) });
      e.url = url;
    }
    let inicio = e.enviado, tentativas = 0, perguntar = e.enviado > 0;
    const seParou = () => { if (e.cancelado) throw Object.assign(new Error('Parado.'), { parado: true }); };
    for (;;) {
      seParou();
      if (perguntar) { // retomada manual: o Google pode já ter mais bytes do que achamos
        perguntar = false;
        const q = await putEnvio(e, 0, true);
        if (q.status === 200 || q.status === 201) { e.resultado = q.json || {}; e.enviado = e.total; break; }
        if (q.status === 404 || q.status === 410) { e.url = null; e.enviado = 0; throw new Error('O envio expirou; comece de novo.'); }
        if (q.status === 308) inicio = inicioDoRange(q.range);
      }
      let r = await putEnvio(e, inicio);
      seParou();
      if (r.status === 200 || r.status === 201) { e.resultado = r.json || {}; e.enviado = e.total; break; }
      if (r.status === 404 || r.status === 410) { e.url = null; e.enviado = 0; throw new Error('O envio expirou; comece de novo.'); }
      if (r.status !== 0 && r.status !== 308 && r.status < 500) throw new Error(`O Google respondeu ${r.status}.`);
      // caiu (rede ou 5xx): espera, pergunta onde parou e continua dali
      let retomou = false;
      while (!retomou) {
        if (++tentativas > 5) { e.enviado = inicio; throw new Error('A conexão caiu várias vezes. Tente de novo.'); }
        await espera(esperaTentativa(tentativas));
        seParou();
        r = await putEnvio(e, 0, true);
        if (r.status === 200 || r.status === 201) { e.resultado = r.json || {}; e.enviado = e.total; break; }
        if (r.status === 404 || r.status === 410) { e.url = null; e.enviado = 0; throw new Error('O envio expirou; comece de novo.'); }
        if (r.status === 308) { inicio = inicioDoRange(r.range); retomou = true; }

}

  const base = `https://www.googleapis.com/drive/v3/files/${encodeURIComponent(id)}?alt=media&supportsAllDrives=true`;
  const tentar = async (forcar, abuso) => fetch(base + (abuso ? '&acknowledgeAbuse=true' : ''), {
    headers: { Authorization: 'Bearer ' + await tokenDownload(forcar), ...(inicio ? { Range: `bytes=${inicio}-` } : {}) },
  });
  let r = await tentar(false, false);
  if (r.status === 401) r = await tentar(true, false);
  if (r.status === 403) {
    const txt = await r.text();
    if (!/cannotDownloadAbusiveFile/.test(txt)) throw erroFinal(/rateLimit|quota/i.test(txt) ? 'O Google pediu para esperar um pouco. Tente de novo.' : 'Sua conta Google não tem acesso a este arquivo.');
    r = await tentar(false, true);
  }
  if (r.status === 404) throw erroFinal('Sua conta Google não tem acesso a este arquivo.');
  if (!r.ok || !r.body) throw new Error(`O Google respondeu ${r.status}.`);
  return r;
}
/** Grava um arquivo do Drive no handle. Devolve 'pulado' | 'baixado'. aoProgredir(bytesNoDisco). */
async function gravar(item, fh, aoProgredir, sempre = false) {
  const atual = sempre ? null : await fh.getFile().catch(() => null);
  if (!sempre && planoRetomada(atual ? atual.size : null, item.tamanho).acao === 'pular') { aoProgredir(item.tamanho); return 'pulado'; }
  const w = await fh.createWritable({ keepExistingData: false });
  let feito = 0, tentativas = 0;
  try {
    aoProgredir(0);
    for (;;) {
      try {
        const r = await pedirArquivo(item.id, feito);
        if (feito && r.status !== 206) { feito = 0; await w.truncate(0); await w.seek(0); aoProgredir(0); }
        const leitor = r.body.getReader();
        for (;;) {
          const { done, value } = await leitor.read();
          if (done) break;
          await w.write(value); feito += value.byteLength; aoProgredir(feito);
        }
        if (item.tamanho != null && feito < item.tamanho) throw new Error('O download veio incompleto.');
        break;
      } catch (err) {
        if (!deveRepetir(err, ++tentativas)) throw err;
        await espera(esperaTentativa(tentativas)); // internet caiu: espera e continua do byte `feito`
      }
    }
    await w.close();
    return 'baixado';
  } catch (err) { await w.abort().catch(() => {}); throw err; }
}

let BAIXA = null; // { fase:'montando'|'baixando'|'feito'|'erro', nome, arquivos:[{item, dir|fh, nome}], total, baixado, feitos, pulados, nativos, falhas:[], atuais:Map, erro }
function novaBaixa(nome) {
  return { fase: 'montando', nome, arquivos: [], total: 0, baixado: 0, feitos: 0, pulados: 0, nativos: 0, falhas: [], atuais: new Map(), erro: '' };

function emAndamento() {

async function baixarPasta(pastaId, nome) {
  if (emAndamento()) return;
  let raiz;
  try { raiz = await showDirectoryPicker({ mode: 'readwrite', id: 'daime-baixar' }); } catch { return; }
  try { await tokenDownload(); } catch (e) { return aviso(MSG[e.codigo] || 'Não foi possível baixar.', 'erro'); }
  arquivar(linhaBaixa());
  BAIXA = novaBaixa(nome);
  const b = BAIXA;
  document.getElementById('dlg-baixar').showModal(); renderBaixa();
  addEventListener('beforeunload', avisoSaida);
  try {
    const montar = async (id, dir) => {
      const { itens } = await api(`/api/drive?pasta=${encodeURIComponent(id)}`);
      const nomes = nomesUnicos(itens.map(i => i.nome));
      for (let k = 0; k < itens.length; k++) {
        const i = itens[k];
        if (i.tipo === 'pasta') await montar(i.id, await dir.getDirectoryHandle(nomes[k], { create: true }));
        else if (ehNativoGoogle(i.mime)) b.nativos++;
        else { b.arquivos.push({ item: i, dir, nome: nomes[k] }); b.total += i.tamanho || 0; }
      }
      renderBaixa();
    };
    await montar(pastaId, await raiz.getDirectoryHandle(nomeWindows(nome), { create: true }));
  } catch (e) {
    removeEventListener('beforeunload', avisoSaida);
    b.fase = 'erro'; b.erro = MSG[e.codigo] || 'Não foi possível ler as pastas no Drive. Tente de novo.'; return renderBaixa();
  }
  await rodarBaixa(b.arquivos);
}
async function baixarArquivo(item) {
  if (emAndamento()) return;
  let fh;
  try { fh = await showSaveFilePicker({ suggestedName: nomeWindows(item.nome), id: 'daime-baixar' }); } catch { return; }
  arquivar(linhaBaixa());
  BAIXA = novaBaixa(item.nome);
  BAIXA.arquivos.push({ item, fh, nome: item.nome }); BAIXA.total = item.tamanho || 0;
  document.getElementById('dlg-baixar').showModal();
  await rodarBaixa(BAIXA.arquivos);
}
/** Baixa a lista (todos ou só as falhas), SIMULTANEOS de cada vez. */
async function rodarBaixa(lista) {
  const b = BAIXA;
  b.fase = 'baixando'; b.erro = ''; b.parar = false; renderBaixa();
  addEventListener('beforeunload', avisoSaida);
  await emParalelo(lista, async a => {
    const chave = a.item.id;
    let antes = 0;
    if (b.parar) { b.falhas.push({ ...a, erro: MSG.google_editor }); return; }
    b.atuais.set(chave, { nome: a.nome, feito: 0, total: a.item.tamanho || 0 }); renderBaixa();
    try {
      const fh = a.fh || await a.dir.getFileHandle(a.nome, { create: true });
      const r = await gravar(a.item, fh, feito => { b.baixado += feito - antes; antes = feito; b.atuais.get(chave).feito = feito; renderBaixa(); }, Boolean(a.fh));
      if (r === 'pulado') b.pulados++; else b.feitos++;
    } catch (err) {
      b.baixado -= antes;
      if (err.codigo === 'google_editor') { b.parar = true; b.erro = MSG.google_editor; }
      b.falhas.push({ ...a, erro: MSG[err.codigo] || err.message || 'Falhou' });
    }
    b.atuais.delete(chave); renderBaixa();
  });
  removeEventListener('beforeunload', avisoSaida);
  b.fase = b.falhas.length ? 'erro' : 'feito'; b.fim = new Date(); renderBaixa();
  if (b.fase === 'feito') aviso(`${b.nome} baixado.`, 'ok');
}

// ------------------------------------------------------------ versão de aprovação no R2 (não vai para o Drive)
async function enviarVersaoR2(t, arquivo, nota) {
  const e = { id: ++envioSeq, arquivo, total: arquivo.size, enviado: 0, estado: 'enviando', r2: { tarefa: t.id, chave: null, enviado: false, nota } };
  ENVIOS.set(e.id, e); renderEnvios();
  await continuarR2(e);
}
/** Envia (se ainda não foi) e registra a versão. "Tentar de novo" volta aqui: o que já chegou não é reenviado. */
async function continuarR2(e) {
  e.estado = 'enviando'; e.erro = ''; renderEnvios();
  try {
    if (!e.r2.enviado) {
      const tipo = e.arquivo.type || 'video/mp4';
      const { url, chave } = await api('/api/r2/envio', { method: 'POST', body: JSON.stringify({ tarefa: e.r2.tarefa, nome: e.arquivo.name, tipo, tamanho: e.arquivo.size }) });
      e.r2.chave = chave; e.enviado = 0;
      const st = await new Promise(ok => {
        const x = new XMLHttpRequest(); e.xhr = x;
        x.open('PUT', url); x.setRequestHeader('Content-Type', tipo);
        x.upload.onprogress = ev => { e.enviado = ev.loaded; renderEnvios(); };
        x.onload = () => ok(x.status); x.onerror = x.onabort = x.ontimeout = () => ok(0);
        x.send(e.arquivo);
      });
      if (st < 200 || st >= 300) throw new Error(st ? `O armazenamento respondeu ${st}.` : 'A conexão caiu. Tente de novo.');
      e.r2.enviado = true; e.enviado = e.total;
    }
    const { numero } = await api('/api/tarefas/versao', { method: 'POST', body: JSON.stringify({ tarefa: e.r2.tarefa, r2: e.r2.chave, nome: e.arquivo.name, nota: e.r2.nota }) });
    e.estado = 'feito'; e.fim = new Date(); arquivar(linhaEnvio(e)); ENVIOS.delete(e.id); renderEnvios();
    aviso(`V${numero} enviada para revisão.`, 'ok');
    versaoVista = null; aba = 'video';
    await recarregar();
  } catch (err) {
    e.estado = 'erro'; e.erro = MSG[err.codigo] || err.message || 'Falhou'; renderEnvios();
  }
}
async function excluirPeloServidor(caminho, ok) {
  try { await api(caminho, { method: 'DELETE' }); aviso(ok, 'ok'); await recarregar(); }
  catch { aviso('Não foi possível excluir. Tente de novo.', 'erro'); }
}

const avisoSaida = ev => { ev.preventDefault(); ev.returnValue = ''; };
async function comecarSubida(repetir = false) {
  const s = SUBIDA; if (!s) return;
  const p = s.plano;
  Object.assign(s, { fase: 'subindo', feitos: 0, pulados: 0, falhas: [], enviado: 0, erro: '', parar: false });
  s.atuais.clear(); renderSubir();
  addEventListener('beforeunload', avisoSaida);
  try {
    // 1. pastas: a da casa dentro da pasta de trabalho, depois as subpastas (pais antes dos filhos)
    const ids = { '': (s.casaId = (await api('/api/drive/pasta', { method: 'POST', body: JSON.stringify({ pai: DRIVE.raiz.id, nome: p.casa }) })).id) };
    for (const caminho of p.pastas) {
      const pai = caminho.includes('/') ? caminho.slice(0, caminho.lastIndexOf('/')) : '';
      ids[caminho] = (await api('/api/drive/pasta', { method: 'POST', body: JSON.stringify({ pai: ids[pai], nome: caminho.split('/').pop() }) })).id;
    }
    // 2. o que já está em cada pasta (para pular)
    const existentes = {};
    for (const caminho of ['', ...p.pastas]) existentes[caminho] = (await api(`/api/drive?pasta=${encodeURIComponent(ids[caminho])}`)).itens;
    // 3. arquivos, SIMULTANEOS de cada vez
    const fila = [];
    for (const a of p.arquivos) {
      a.estado = '';
      if (jaNoDrive(a, existentes[a.pasta])) { a.estado = 'pulado'; s.pulados++; s.enviado += a.tamanho; } else fila.push(a);
    }
    renderSubir();
    await emParalelo(fila, async a => {
        if (s.parar) return; // parado por você: o resto fica para "Continuar"
        const e = { id: ++envioSeq, arquivo: a.arquivo, destino: { pasta: ids[a.pasta] }, total: a.tamanho, enviado: 0, estado: 'enviando', url: null };
        let antes = 0;
        e.aoProgredir = () => { s.enviado += e.enviado - antes; antes = e.enviado; renderSubir(); };
        s.atuais.set(e.id, e); renderSubir();
        await continuarEnvio(e);
        s.atuais.delete(e.id);
        if (e.cancelado) { s.enviado -= antes; renderSubir(); return; }
        if (e.estado === 'feito') { a.estado = 'subiu'; s.feitos++; s.enviado += e.total - antes; } else { a.estado = 'falhou'; s.falhas.push(a); s.enviado -= antes; }
        renderSubir();
    });
    s.fase = s.parar ? 'parado' : s.falhas.length ? 'erro' : 'feito';
  } catch (err) {
    s.fase = 'erro';
    s.erro = MSG[err.codigo] || 'Não foi possível criar as pastas no Drive. Tente de novo.';
  }
  removeEventListener('beforeunload', avisoSaida);
  s.fim = new Date();
  renderSubir();
  if (s.fase === 'feito') aviso(`${p.casa} está no Drive.`, 'ok');
}

      <div class="acoes"><button class="btn peq" type="button" data-raiz-ir="root">Meu Drive</button><button class="btn peq" type="button" data-raiz-ir="compartilhados">Compartilhados comigo</button></div>
      <p style="margin:0;font-weight:600">${esc(d.pasta.nome)}</p>
      <div class="lista-casas">${d.itens.filter(i => i.tipo === 'pasta').map(i => `<button type="button" data-raiz-ir="${esc(i.id)}">${ico('pasta')} ${esc(i.nome)}</button>`).join('') || '<p class="carregando">Sem subpastas.</p>'}</div>
      <div class="acoes" style="justify-content:flex-end"><button class="btn" type="button" onclick="this.closest('dialog').close()">Fechar</button>
        ${real ? `<button class="btn prim" type="button" data-raiz-usar="${esc(d.pasta.id)}">Usar “${esc(d.pasta.nome)}”</button>` : ''}</div>`;
  } catch (e) { corpo.innerHTML = `<h2>Pasta de trabalho</h2><p class="aviso-box erro">${esc(MSG[e.codigo] || 'Não foi possível abrir o Drive.')}</p><div class="acoes"><button class="btn" type="button" onclick="this.closest('dialog').close()">Fechar</button></div>`; }
}
async function usarRaiz(id) {
  try {
    const { raiz } = await api('/api/drive', { method: 'POST', body: JSON.stringify({ raiz: id }) });
    DRIVE.raiz = raiz; document.getElementById('dlg-raiz').close(); aviso(`Pasta de trabalho: ${raiz.nome}.`, 'ok'); renderTopo();
  } catch (e) { aviso('Não foi possível usar essa pasta.', 'erro'); }
}

// ------------------------------------------------------------ início
async function iniciar() {
  const { data: { session } } = await SB.auth.getSession();
  if (!session) return location.replace('painel.html');
  const papel = await SB.rpc('papel');
  if (papel.error || !['dono', 'editor'].includes(papel.data)) { await SB.auth.signOut(); return location.replace('painel.html'); }
  try { DRIVE = await api('/api/drive/estado'); EU = { papel: DRIVE.papel, nome: DRIVE.nome, email: session.user?.email }; }
  catch { EU = { papel: papel.data, nome: papel.data === 'dono' ? 'Cainan' : 'Editor', email: session.user?.email }; DRIVE = { conectado: false }; aviso('O servidor da Edição não respondeu. Arquivos e vídeos podem não abrir.', 'erro'); }
  document.getElementById('app').hidden = false;
  const r = new URLSearchParams(location.search).get('drive');
  if (r) {
    aviso({ ok: 'Google Drive conectado.', cancelado: 'Conexão com o Drive cancelada.', sem_permissao: 'Só o dono conecta o Drive.', nao_configurado: 'Faltam as credenciais do Google no servidor.' }[r] || 'Não foi possível conectar o Drive.', r === 'ok' ? 'ok' : 'erro');
    history.replaceState(null, '', 'edicao.html');
    if (r === 'ok' && !DRIVE.raiz) setTimeout(abrirRaiz, 300);
  }
  const g = new URLSearchParams(location.search).get('google');
  if (g) {
    aviso({ ok: 'Sua conta Google está conectada. Já dá para baixar.', cancelado: 'Conexão com o Google cancelada.', nao_configurado: 'Faltam as credenciais do Google no servidor.' }[g] || 'Não foi possível conectar sua conta Google.', g === 'ok' ? 'ok' : 'erro');
    history.replaceState(null, '', 'edicao.html');
  }
  await recarregar();
}
addEventListener('focus', () => { if (EU) recarregar(); });
iniciar();
</script>
