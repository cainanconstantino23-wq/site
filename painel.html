<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Painel · Daime Filmes</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600&display=swap">
<style>

/* Layout: barra lateral com as etapas, área de trabalho à direita, ficha do lead em painel deslizante. */
/* Areia e azul: a mesma identidade do site (DESIGN.md), em versão de ferramenta de trabalho. */
:root{
  --bg:#F3EDE2; --bg2:#ECE3D3; --surface:#FBF8F2; --ink:#0C2C6B; --muted:#3D5D9C; --line:#E0D3BC;
  --accent:#123C8C; --accent-ink:#F3EDE2; --soft:#E1E0E2; --hot:#B42318; --hot-soft:#F6DDD5; --ok:#2E6B45;
  --a-villas:#123C8C; --a-pousadas:#2C7573; --a-imoveis:#5E4A8E; --a-eventos:#9B3F66; --a-gastro:#8A5A2E; --a-obras:#6B6530; --a-passeios:#2A7AA0;
  --shadow:0 1px 2px rgba(12,44,107,.06),0 10px 28px -16px rgba(12,44,107,.28);
  --display:"Switzer",system-ui,-apple-system,"Segoe UI",sans-serif; --body:"Switzer",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  accent-color:var(--accent); color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B1730; --bg2:#081226; --surface:#112142; --ink:#F3EDE2; --muted:#AEBBD8; --line:#1F3360;
  --accent:#E6D7BA; --accent-ink:#0B1730; --soft:#22324F; --hot:#FF8F80; --hot-soft:#3B1D27; --ok:#8FD3A6;
  --a-villas:#9DB7F0; --a-pousadas:#7CC9C3; --a-imoveis:#B9A6E8; --a-eventos:#E8A0C0; --a-gastro:#E2B48A; --a-obras:#D2C98A; --a-passeios:#8CCBEA;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px -16px rgba(0,0,0,.65); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0B1730; --bg2:#081226; --surface:#112142; --ink:#F3EDE2; --muted:#AEBBD8; --line:#1F3360;
  --accent:#E6D7BA; --accent-ink:#0B1730; --soft:#22324F; --hot:#FF8F80; --hot-soft:#3B1D27; --ok:#8FD3A6;
  --a-villas:#9DB7F0; --a-pousadas:#7CC9C3; --a-imoveis:#B9A6E8; --a-eventos:#E8A0C0; --a-gastro:#E2B48A; --a-obras:#D2C98A; --a-passeios:#8CCBEA;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px -16px rgba(0,0,0,.65); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
/* barra lateral */
.side{position:sticky;top:0;height:100vh;padding:22px 14px;display:flex;flex-direction:column;gap:22px;background:var(--bg2);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.mark{width:34px;height:34px;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:17px}
.brand b{font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:-.01em;display:block;line-height:1.1}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 10px 6px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-weight:500;cursor:pointer;transition:background .2s,color .2s,transform .2s var(--ease)}
.nav button:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 6%,transparent)}
.nav button[aria-current=page]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.nav .n{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--ink) 8%,transparent);font-variant-numeric:tabular-nums}
.nav button[aria-current=page] .n{background:var(--accent);color:var(--accent-ink)}
.nav .badge{margin-left:auto;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--hot);color:#fff}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 8px;font-size:12px;color:var(--muted)}
.theme{align-self:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer}

/* área de trabalho */
.main{padding:34px clamp(16px,4vw,48px) 80px;min-width:0}
.view{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:26px;animation:viewIn .5s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
h1{font-family:var(--display);font-size:clamp(28px,4vw,38px);font-weight:600;letter-spacing:-.02em;line-height:1.08;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-size:20px;font-weight:600;letter-spacing:-.01em;margin:0}
.sub{color:var(--muted);margin:6px 0 0;max-width:62ch}
.rise{animation:rise .55s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;color:var(--ink);transition:transform .18s var(--ease),box-shadow .18s,background .18s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 12px;font-size:13px}

/* números */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-size:36px;font-weight:600;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.stat.hot b{color:var(--hot)}
.cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.panel-head span{font-size:13px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:6px 0;margin:0}

/* linhas de lead */
.rows{display:flex;flex-direction:column;gap:2px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 10px;margin:0 -10px;border-radius:12px;border:0;background:transparent;text-align:left;cursor:pointer;width:calc(100% + 20px);transition:background .18s,transform .18s var(--ease)}
.row:hover{background:color-mix(in srgb,var(--ink) 5%,transparent);transform:translateX(2px)}

.dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--accent))}
.row .who{min-width:0}
.row .who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .who span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .right{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);white-space:nowrap}
.score{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--bg2);color:var(--muted);white-space:nowrap}
.pill.s-contatado,.pill.s-lembrete{background:var(--soft);color:var(--accent)}
.pill.s-respondeu,.pill.s-reuniao,.pill.s-fechou{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.s-sem{background:var(--bg2);color:var(--muted);text-decoration:line-through}
.pill.due{background:var(--hot-soft);color:var(--hot)}
.chan{display:inline-flex;gap:4px}
.chan i{font-style:normal;font-size:11px;font-weight:600;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--bg2);color:var(--muted)}
.chan i.on{background:var(--soft);color:var(--accent)}

/* áreas */
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.area{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;cursor:pointer;text-align:left;transition:transform .25s var(--ease),box-shadow .25s,border-color .25s;overflow:hidden}
.area:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.area::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:var(--c);opacity:.08;transition:transform .5s var(--ease),opacity .3s}
.area:hover::after{transform:scale(1.5);opacity:.13}
.area-top{display:flex;align-items:center;gap:14px}
.ring{width:60px;height:60px;flex:none;position:relative}
.ring svg{width:60px;height:60px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:var(--bg2)}
.ring .fg{stroke:var(--c);stroke-linecap:round;transition:stroke-dashoffset 1.1s var(--ease)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.area h2{font-size:19px}
.area p{margin:0;color:var(--muted);font-size:14px}
.area-nums{display:flex;gap:18px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.area-nums b{color:var(--ink);font-size:15px}
.area .go{font-size:13px;font-weight:600;color:var(--c);display:inline-flex;gap:6px;align-items:center}
.area .go span{transition:transform .25s var(--ease)}
.area:hover .go span{transform:translateX(4px)}

/* filtros */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 220px;min-width:0;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.select{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;gap:7px;align-items:center;transition:background .18s,color .18s,border-color .18s,transform .18s var(--ease)}
.chip:hover{transform:translateY(-1px)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .dot{width:8px;height:8px}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* quadro */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(158px,1fr);gap:14px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--bg2);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.col h3{margin:0;font-size:13px;font-weight:600;display:flex;justify-content:space-between;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:transform .2s var(--ease),box-shadow .2s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.card b{font-size:14px}
.card span{font-size:12px;color:var(--muted)}

/* etapas do robô */
.steps{counter-reset:s;display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px minmax(0,1fr);gap:14px;align-items:start}
.steps li::before{content:counter(s);width:34px;height:34px;border-radius:11px;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-family:var(--display)}
.steps b{display:block}
.steps span{color:var(--muted);font-size:14px}
code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--bg2);padding:1px 6px;border-radius:6px}
.note{background:var(--hot-soft);color:var(--ink);border-radius:14px;padding:14px 16px;font-size:14px}
.note b{color:var(--hot)}

/* ficha do lead */
.scrim{position:fixed;inset:0;background:rgba(6,12,18,.5);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--surface);border-left:1px solid var(--line);transform:translateX(104%);visibility:hidden;transition:transform .45s var(--ease),visibility 0s .45s;z-index:21;display:flex;flex-direction:column}
.drawer.open{transform:none;visibility:visible;box-shadow:-24px 0 60px -30px rgba(0,0,0,.5);transition:transform .45s var(--ease),visibility 0s}
.d-head{padding:22px 24px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.d-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.d-top h2{font-size:24px;line-height:1.15;overflow-wrap:anywhere}
.x{border:1px solid var(--line);background:var(--surface);width:34px;height:34px;border-radius:10px;cursor:pointer;flex:none;font-size:16px}
.d-meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted);align-items:center}
.d-body{padding:20px 24px 40px;overflow-y:auto;display:flex;flex-direction:column;gap:20px}
.block{display:flex;flex-direction:column;gap:8px}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.about{margin:0;font-size:14px;overflow-wrap:anywhere}
.obs{margin:0;font-size:13px;color:var(--hot);overflow-wrap:anywhere}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;padding:7px 8px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:background .2s,color .2s}
.seg button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button.off{opacity:.5}
.to{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.to code{user-select:all}
.field{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
textarea.field{min-height:190px;resize:vertical;line-height:1.5;font-size:14px}
textarea.notes{min-height:70px}
.resumo{margin:0;font-size:13px;color:var(--muted);padding:10px 12px;border-radius:10px;background:var(--bg2);overflow-wrap:anywhere}
.prox{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.motivo{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:22px;width:min(360px,calc(100% - 32px))}
.motivo::backdrop{background:rgba(6,12,18,.5)}
.motivo h2{margin:0 0 14px;font-size:18px}
.motivos{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.motivos .btn{justify-content:flex-start}
.col.alvo{outline:2px dashed var(--accent);outline-offset:-2px}
.card.arrastando{opacity:.4}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.hist{margin:0;padding:0;list-style:none;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* aviso */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:500;transition:transform .35s var(--ease),opacity .35s;z-index:40;pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1}

/* celular */
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;padding:8px max(10px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);z-index:10}
  .brand,.side .foot,.nav small{display:none}
  .nav{flex-direction:row;width:100%;justify-content:space-between}
  .nav button{flex-direction:column;gap:3px;font-size:11px;padding:6px 4px;text-align:center;align-items:center}
  .nav .badge{position:absolute;margin:-4px 0 0 26px}
  .main{padding:22px max(16px,env(safe-area-inset-left,0px)) 110px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols{grid-template-columns:minmax(0,1fr)}
  .row .right .chan{display:none}
}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }

/* ---- login ---- */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px}
.gate-card{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:32px;display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow);animation:rise .6s var(--ease) both}
.gate-card h1{font-size:28px}
.gate-card p{margin:0;color:var(--muted);font-size:14px}
.gate-card form{display:flex;flex-direction:column;gap:12px}
.gate-card .btn{justify-content:center;padding:12px}
.err{color:var(--hot);font-size:14px;min-height:20px;margin:0}
.back{font-size:13px;color:var(--muted);text-decoration:none;align-self:center}
.spinner{width:18px;height:18px;border-radius:50%;border:2px solid color-mix(in srgb,currentColor 30%,transparent);border-top-color:currentColor;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{min-height:60vh;display:grid;place-items:center;color:var(--muted)}
/* ---- fila ---- */
.queue{display:flex;flex-direction:column;gap:12px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;transition:border-color .25s,box-shadow .25s,opacity .3s,transform .3s var(--ease)}
.q:hover{box-shadow:var(--shadow)}
.q.out{opacity:0;transform:translateX(24px)}
.q-top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.q-who{display:flex;align-items:center;gap:10px;min-width:0;border:0;background:transparent;padding:0;cursor:pointer;text-align:left}
.q-who b{font-size:16px;overflow-wrap:anywhere}
.q-who span{font-size:13px;color:var(--muted)}
.q-tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--bg2);color:var(--muted)}
.tag.email{background:var(--soft);color:var(--accent)}
.tag.manual{background:color-mix(in srgb,var(--a-gastro) 16%,transparent);color:var(--a-gastro)}
.tag.lemb{background:var(--hot-soft);color:var(--hot)}
.q-prev{margin:0;font-size:14px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.q-prev b{color:var(--ink);font-weight:600}
.q-edit{display:flex;flex-direction:column;gap:8px}
.q-edit textarea{min-height:220px}
.q-acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.q-acts .sp{margin-left:auto}
.q-sel{padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:13px}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec span{font-size:13px;color:var(--muted)}
.tokenbox{display:flex;gap:8px;flex-wrap:wrap}
.tokenbox input{flex:1 1 220px;min-width:0;font-family:ui-monospace,Menlo,monospace;font-size:12px}

/* ---- Areia e azul: refinamentos (17/11) ---- */
body{letter-spacing:-.005em}
::selection{background:var(--accent);color:var(--accent-ink)}
*{scrollbar-color:color-mix(in srgb,var(--ink) 25%,transparent) transparent}
h1{font-size:34px;letter-spacing:-.03em;line-height:1.05}
h2{font-size:19px;letter-spacing:-.015em}
.label,.nav small{font-size:13px;letter-spacing:0;text-transform:none;font-weight:600;color:var(--muted)}
.mark{background:var(--accent);color:var(--accent-ink);border-radius:999px;font-weight:600}
.brand b{letter-spacing:-.02em}
.side{border-right:0}
.btn{border-radius:999px}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,var(--ink))}
.panel,.q,.col,.card{border-color:transparent}
.panel{background:var(--surface)}
.card{background:var(--surface);box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 6%,transparent)}
.field{background:var(--surface);border-color:var(--line)}
.field:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
input[type=date].field{font-variant-numeric:tabular-nums}
/* contagem do dia: uma linha, sem cartões iguais */
.tally{display:flex;flex-wrap:wrap;gap:4px 34px;margin:0;padding:2px 0 4px}
.tally div{display:flex;flex-direction:column-reverse;gap:0}
.tally dd{margin:0;font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--ink)}
.tally dt{font-size:13px;color:var(--muted)}
.tally .hot dd{color:var(--hot)}
.tally .zero dd{color:color-mix(in srgb,var(--muted) 55%,transparent)}
/* ficha: cabeçalho fixo com situação e próximo passo, depois abas */
.drawer{display:block;overflow-y:auto;overscroll-behavior:contain}
.d-head{gap:12px;padding-bottom:0;background:var(--surface)}
.d-head .resumo{margin-top:2px}
.d-ctrl{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.6fr);gap:12px}
.drawer .d-body{overflow:visible}
.tabs{display:flex;gap:22px;margin:4px 0 0}
.tabs button{border:0;background:transparent;padding:10px 0 12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button span{font-size:12px;font-variant-numeric:tabular-nums;padding:1px 7px;border-radius:999px;background:var(--bg2);margin-left:4px}
.tabs button:focus-visible{outline-offset:-2px}
/* conversa */
.thread{display:flex;flex-direction:column;gap:12px}
.msg{border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;max-width:94%}
.msg.out{background:var(--bg);align-self:flex-start}
.msg.in{background:color-mix(in srgb,var(--accent) 9%,var(--surface));align-self:flex-end;width:94%}
.msg header{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:13px;color:var(--muted)}
.msg header b{color:var(--ink);font-weight:600}
.msg header a{margin-left:auto;font-weight:600;text-underline-offset:3px}
.msg-subj{margin:0;font-weight:600;font-size:14px;overflow-wrap:anywhere}
.msg-text{margin:0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.in .field{background:var(--surface)}
.compose{display:flex;flex-direction:column;gap:8px;padding-top:18px;margin-top:6px;border-top:1px solid var(--line)}
.compose h3{margin:0;font-size:16px;letter-spacing:-.01em}
@media (max-width:860px){ .d-ctrl{grid-template-columns:minmax(0,1fr)} .tally{gap:4px 22px} .tally dd{font-size:24px} }

function tipoDoSegmento_(segmento) {
  var s = String(segmento || '').toLowerCase();
  if (s.indexOf('villa') >= 0 || s.indexOf('temporada') >= 0) return 'villas';
  if (s.indexOf('pousada') >= 0 || s.indexOf('hotel') >= 0) return 'pousadas';
  if (s.indexOf('imobili') >= 0 || s.indexOf('incorpor') >= 0) return 'imoveis';
  if (s.indexOf('casament') >= 0 || s.indexOf('evento') >= 0) return 'eventos';
  if (s.indexOf('restaurante') >= 0 || s.indexOf('beach') >= 0) return 'gastro';
  if (s.indexOf('arquitet') >= 0 || s.indexOf('constru') >= 0) return 'obras';
  if (s.indexOf('passeio') >= 0 || s.indexOf('experi') >= 0) return 'passeios';
  return null;
}

function nomeCurto_(empresa) { return String(empresa || '').replace(/\s*\(.*?\)\s*/g, ' ').trim(); }
function maiuscula_(t) { return t.charAt(0).toUpperCase() + t.slice(1); }
function minuscula_(t) { return t.charAt(0).toLowerCase() + t.slice(1); }

  var A = function (nome, livro, assunto, texto) { return { nome: nome, livro: livro, assunto: assunto, texto: texto }; };

  if (canal === 'email' && etapa === 0) return [

      p(['Vocês conseguem dar uma olhada esta semana? Se fizer sentido, me respondam aqui e eu conto como seria para vocês.',
         'Dá uma olhada e me digam: algo assim faria sentido para vocês?']) + sign + '\n\n' + RODAPE),
    A('Franqueza total', SEM_MEDO, 'Daime Filmes, produtora de Trancoso',
      saud() + '\n\n' + 'Vou ser direto: sou o Cainan, tenho uma produtora aqui em Trancoso, a Daime Filmes, e queria mostrar meu trabalho para vocês. Não estou vendendo nada neste e-mail.' +
      (frase ? '\n\n' + frase : '') + '\n\n' + 'Filmo ' + m.faz + '. ' + m.vitrine + '\n\n' + link + '\n\n' +
      'Se gostarem, me respondam. Se não fizer sentido, também é só me dizer, sem problema nenhum.' + sign),
    A('Despertar curiosidade', SEM_MEDO + ' / ' + FANATICA, ass(p(['Uma imagem para {{Empresa}}', '{{Empresa}}, do alto'])),

      'Se bater a curiosidade de ver como ficaria com ' + m.deles + ', me respondam que eu conto.' + sign + '\n\n' + RODAPE),
    A('Pedido pequeno', SEM_MEDO + ' / ' + FANATICA, 'Um minuto, um filme',
      saud() + '\n\n' + 'Sou o Cainan, da Daime Filmes, aqui de Trancoso, e tenho um pedido pequeno: um minuto para verem um filme.' + '\n\n' +

      'Se depois desse minuto fizer sentido conversar, é só responder. Se não, tudo certo.' + sign),
    A('Pergunta para abrir conversa', CONCER, ass('Uma pergunta para {{Empresa}}'),
      saud() + '\n\n' + quem() + ' Queria fazer uma pergunta rápida.' + '\n\n' + m.pergunta + '\n\n' +
      (frase ? frase + ' ' : '') + 'Pergunto porque é exatamente aí que o vídeo ajuda. ' + p(ganhos) + '\n\n' +
      'Se quiserem ver como fica, os filmes estão aqui:\n\n' + link + '\n\n' +

    A('Mostrar que conhece o mercado', CONCER + ' / ' + FANATICA, 'Antes da alta temporada',
      saud() + '\n\n' + m.mercado + '\n\n' + quem() + ' ' + p(ganhos) + (frase ? '\n\n' + frase : '') + '\n\n' +

/** etapa: 0 = primeiro contato, 1 = lembrete 1, 2 = lembrete 2. canal: 'email', 'wa' ou 'ig'.
    tatica: índice da abordagem (padrão 0). sorteio(n) varia trechos dentro da abordagem; sem ele, sai a primeira opção. */
function montarMensagem_(lead, etapa, canal, sorteio, tatica) {
  var p = function (opcoes) { return opcoes[sorteio ? sorteio(opcoes.length) : 0]; };
  var lista = abordagens_(lead, etapa, canal, p);
  var i = ((tatica || 0) % lista.length + lista.length) % lista.length;

  }
  return { assunto: assunto, texto: texto, tatica: a.nome, livro: a.livro, idx: i, total: lista.length };
}

}

async function saveQ(f, situacao){

async function qAct(act, id, target){
  const f = FILA.find(x => x.id === id), l = f && getLead(f.lead_id);

    const list = FILA.filter(x => x.situacao === 'pendente' && x.canal === 'email');

  if (!f) return;

  if (act === 'copiar') return copy(msgOf(f).texto);
  if (act === 'nova') { const d = drafts[id] = drafts[id] || {}, v = outraVersao_(l, f.etapa, f.canal, d.tat || 0); d.tat = v.idx; d.texto = v.texto; if (f.etapa === 0) d.assunto = v.assunto; render(); return toastAbordagem(v); }
  if (act === 'abrir') { target.href = openUrl(l, f.canal, msgOf(f)); if (f.canal !== 'email') copy(msgOf(f).texto); return; }
  if (act === 'aprovar') { await saveQ(f, 'aprovada'); await fadeQ(id); toast('Aprovado. O robô envia em até 10 minutos.'); }
  if (act === 'enviei') { await saveQ(f, 'enviada'); await fadeQ(id); await loadAll(); toast('Registrado como enviado'); }
  if (act === 'desfazer') { await ok(SB.from('fila').update({ situacao:'pendente', decidido:null }).eq('id', id).eq('situacao', 'aprovada')); await loadAll(); toast('Voltou para a fila'); }
  if (act === 'reaprovar') { await ok(SB.from('fila').update({ situacao:'aprovada', erro:null, decidido:new Date().toISOString() }).eq('id', id)); await loadAll(); toast('Aprovado de novo'); }
  if (act === 'pular') {

}

}
function salvarCampo(l, campo, valor, msgErro){
  l[campo] = valor; debounce(campo + l.id, () => SB.from('leads').update({ [campo]: valor || null }).eq('id', l.id).then(r => r.error && toast(msgErro)));
}
function pedirAoClaude(texto){
  copy(texto); window.open('https://claude.ai/new', '_blank', 'noopener');
  toast('Pedido copiado. Cole no Claude e traga o resultado para cá.');
}
const later = {}; function debounce(key, fn){ clearTimeout(later[key]); later[key] = setTimeout(fn, 700); }

// ------------------------------------------------------------ nova empresa
function newLeadForm(){
  cur = null;
  document.getElementById('drawer').innerHTML = `
    <div class="d-head"><div class="d-top"><h2>Adicionar empresa</h2><button class="x" type="button" data-act="close" aria-label="Fechar">✕</button></div></div>
    <form class="d-body" id="fnew">
      <div class="block"><label class="label" for="n-emp">Empresa</label><input class="field" id="n-emp" required></div>
      <div class="grid2"><div class="block"><label class="label" for="n-area">Área</label><select class="field" id="n-area">${Object.keys(AREAS).map(k => `<option value="${k}">${esc(AREAS[k].nome)}</option>`).join('')}</select></div>
        <div class="block"><label class="label" for="n-nota">Nota (0 a 10)</label><input class="field" id="n-nota" type="number" min="0" max="10" value="7"></div></div>
      <div class="block"><label class="label" for="n-cid">Cidade</label><input class="field" id="n-cid"></div>
      <div class="block"><label class="label" for="n-site">Site</label><input class="field" id="n-site" placeholder="https://"></div>
      <div class="block"><label class="label" for="n-mail">E-mail</label><input class="field" id="n-mail" type="email"></div>
      <div class="grid2"><div class="block"><label class="label" for="n-wa">WhatsApp</label><input class="field" id="n-wa" placeholder="73 99999-9999"></div>
        <div class="block"><label class="label" for="n-ig">Instagram</label><input class="field" id="n-ig" placeholder="@perfil"></div></div>
      <div class="block"><label class="label" for="n-frase">Frase personalizada</label><textarea class="field notes" id="n-frase" placeholder="Um detalhe verdadeiro sobre a empresa, em uma frase."></textarea></div>
      <div class="acts"><button class="btn primary" type="submit">Salvar empresa</button></div>
    </form>`;
  document.getElementById('drawer').classList.add('open'); document.getElementById('scrim').classList.add('open');
}
async function addLead(){
  const v = id => document.getElementById(id).value.trim(), area = v('n-area');
  let site = v('n-site'); if (site && !/^https?:\/\//.test(site)) site = 'https://' + site;
  const l = { id:'c' + Date.now().toString(36), custom:true, nota: Math.max(0, Math.min(10, parseInt(v('n-nota'), 10) || 7)), area, segmento:SEGS[area], empresa:v('n-emp'), cidade:v('n-cid'), site, email:v('n-mail'), ig:v('n-ig').replace(/^@/,''), wa:waDigits(v('n-wa')), frase:v('n-frase') };
  if (!l.empresa) return;
  await ok(SB.from('leads').insert(l)); await loadAll(); toast('Empresa adicionada'); render(); openLead(l.id);
}
function exportCsv(){
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g,'""') + '"';
  const H = ['Nota','Área','Empresa','Cidade','Site','E-mail','Instagram','WhatsApp','Situação','Primeiro contato','Último envio','Anotações'];
  const rows = LEADS.map(l => [l.nota, MODELOS[l.area].nome, l.empresa, l.cidade, l.site, l.email, l.ig ? '@' + l.ig : '', l.wa ? '+' + waDigits(l.wa) : '', l.status, fmtDate(l.primeiro), fmtDate(l.ultimo), l.notas].map(q).join(','));
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + H.map(q).join(',') + '\n' + rows.join('\n')], { type:'text/csv' })); a.download = 'daime-prospeccao.csv';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

// ------------------------------------------------------------ tema e aviso
let theme = ''; try { theme = localStorage.getItem('daime-tema') || ''; } catch(e) {}
function applyTheme(){
  if (theme) document.documentElement.setAttribute('data-theme', theme); else document.documentElement.removeAttribute('data-theme');
  document.getElementById('theme').textContent = 'Tema: ' + (theme === 'dark' ? 'escuro' : theme === 'light' ? 'claro' : 'automático');
}
let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

// ------------------------------------------------------------ eventos
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-qact],[data-go],[data-open],[data-area],[data-farea],[data-act],[data-etapa],[data-canal],[data-tab]'); if (!t) return;
  try {
    if (t.dataset.qact) { if (t.dataset.qact !== 'abrir') e.preventDefault(); e.stopPropagation(); return await qAct(t.dataset.qact, t.dataset.id, t); }
    if (t.dataset.go) return go(t.dataset.go);
    if (t.dataset.open) return openLead(t.dataset.open);
    if (t.dataset.area) return go('leads', { area: t.dataset.area, status:'todos', q:'' });
    if (t.dataset.farea) { filter.area = t.dataset.farea; return render(); }
    if (t.dataset.tab) { cur.tab = t.dataset.tab; return renderDrawer(); }
    if (t.dataset.etapa) { cur.etapa = +t.dataset.etapa; return renderDrawer(); }
    if (t.dataset.canal) { cur.canal = t.dataset.canal; return renderDrawer(); }
    const a = t.dataset.act, l = cur && getLead(cur.id);
    if (a === 'close') return closeLead();
    if (a === 'copy') return copy(document.getElementById('dtext').value);
    if (a === 'nova') { const k = cur.canal + cur.etapa, v = outraVersao_(l, cur.etapa, cur.canal, dtxt['t' + k] || 0); dtxt['t' + k] = v.idx; dtxt[k] = v.texto; if (cur.etapa === 0) dtxt['s' + k] = v.assunto; renderDrawer(); return toastAbordagem(v); }
    if (a === 'open') { const m = dMsg(l); t.href = openUrl(l, cur.canal, m); if (cur.canal !== 'email') copy(m.texto); return; }
    if (a === 'pesquisar') return pedirAoClaude(promptPesquisa(l, MODELOS[l.area].nome));
    if (a === 'sugerir') { const hist = FILA.filter(f => f.lead_id === l.id && f.situacao === 'enviada'); return pedirAoClaude(promptResposta(l, MODELOS[l.area].nome, resumoLead(l, hist, hojeStr()))); }
    if (a === 'sent') return await upsertMsg('enviada');
    if (a === 'aprovar') return await upsertMsg('aprovada');
    if (a === 'novo') return newLeadForm();
    if (a === 'del') { await ok(SB.from('leads').delete().eq('id', cur.id).eq('custom', true)); await loadAll(); toast('Empresa excluída'); return closeLead(); }
    if (a === 'csv') return exportCsv();
    if (a === 'token') { const tok = await ok(SB.rpc('robo_token'), 'Não foi possível buscar o token.'); document.getElementById('tok').value = tok; return copy(tok); }
  } catch(err) { /* o aviso já foi mostrado */ }
});
document.addEventListener('input', e => {
  const el = e.target, id = el.id;
  if (id === 'q') { filter.q = el.value; const L = filtered(); document.getElementById('rows').innerHTML = L.map(rowHtml).join('') || '<p class="empty">Nenhuma empresa com esse filtro.</p>'; document.getElementById('lcount').textContent = L.length + ' empresa' + (L.length === 1 ? '' : 's'); return; }
  if (el.dataset.qtext) { (drafts[el.dataset.qtext] = drafts[el.dataset.qtext] || {}).texto = el.value; return; }
  if (el.dataset.qsubj) { (drafts[el.dataset.qsubj] = drafts[el.dataset.qsubj] || {}).assunto = el.value; return; }
  if (!cur) return;
  const l = getLead(cur.id), k = cur.canal + cur.etapa;
  if (id === 'dtext') dtxt[k] = el.value;
  if (id === 'dsubj') dtxt['s' + k] = el.value;
  if (id === 'dprox') salvarCampo(l, 'proximo', el.value, 'Próximo passo não salvo');
  if (id === 'dpesq') salvarCampo(l, 'pesquisa', el.value, 'Pesquisa não salva');
  if (id === 'dresp') salvarCampo(l, 'resposta', el.value, 'Resposta não salva');
  if (id === 'dnotes') { l.notas = el.value; debounce('n' + l.id, () => SB.from('leads').update({ notas: l.notas }).eq('id', l.id).then(r => r.error && toast('Anotação não salva'))); }
  if (id === 'dfrase') { l.frase = el.value; debounce('f' + l.id, () => SB.from('leads').update({ frase: l.frase }).eq('id', l.id).then(r => { if (r.error) toast('Frase não salva'); else if (cur && cur.id === l.id && dtxt[cur.canal + cur.etapa] == null) { const t = document.getElementById('dtext'); if (t) t.value = dMsg(l).texto; } })); }
});
document.addEventListener('change', async e => {
  const el = e.target, id = el.id;
  try {
    if (id === 'fstatus') { filter.status = el.value; render(); }
    if (id === 'fsort') { filter.sort = el.value; render(); }
    if (el.dataset.qcanal) { const f = FILA.find(x => x.id === el.dataset.qcanal); delete drafts[f.id]; await ok(SB.from('fila').update({ canal: el.value, assunto:null, texto:null }).eq('id', f.id)); f.canal = el.value; f.assunto = f.texto = null; render(); }
    if (id === 'dstatus' && cur) { const l = getLead(cur.id), antes = l.status;
      if (!(await moverLead(l.id, el.value))) { el.value = antes; return; }
      cur.etapa = stageOf(l); renderDrawer(); renderNav(); }
    if (id === 'dproxem' && cur) { const l = getLead(cur.id); l.proximo_em = el.value || null; await ok(SB.from('leads').update({ proximo_em: l.proximo_em }).eq('id', l.id), 'Data não salva'); renderDrawer(); }
  } catch(err) {}
});
document.addEventListener('submit', async e => {
  if (e.target.id === 'fnew') { e.preventDefault(); try { await addLead(); } catch(err) {} }
  if (e.target.id === 'login') {
    e.preventDefault();
    const btn = document.getElementById('l-btn'), err = document.getElementById('l-err'); err.textContent = ''; btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
    const { error } = await SB.auth.signInWithPassword({ email: document.getElementById('l-email').value.trim(), password: document.getElementById('l-senha').value });
    btn.disabled = false; btn.textContent = 'Entrar';
    if (error) { err.textContent = /invalid/i.test(error.message) ? 'Senha incorreta.' : 'Não foi possível entrar. Tente de novo.'; return; }
    document.getElementById('l-senha').value = ''; boot();
  }
});
// Funil: arrastar cartões entre colunas
let arrastado = null;
document.addEventListener('dragstart', e => { const c = e.target.closest && e.target.closest('[data-drag]'); if (!c) return; arrastado = c.dataset.drag; c.classList.add('arrastando'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', arrastado); });
document.addEventListener('dragend', () => { arrastado = null; document.querySelectorAll('.arrastando,.col.alvo').forEach(x => x.classList.remove('arrastando', 'alvo')); });
document.addEventListener('dragover', e => { const col = arrastado && e.target.closest('[data-col]'); if (!col) return; e.preventDefault(); document.querySelectorAll('.col.alvo').forEach(x => x !== col && x.classList.remove('alvo')); col.classList.add('alvo'); });
document.addEventListener('drop', async e => {
  const col = arrastado && e.target.closest('[data-col]'); if (!col) return; e.preventDefault();
  const id = arrastado, l = getLead(id); col.classList.remove('alvo');
  if (!l || col.dataset.sts.split('|').includes(l.status)) return;
  try { if (await moverLead(id, col.dataset.col)) { renderNav(); render(); } } catch (err) {}
});
document.getElementById('scrim').addEventListener('click', closeLead);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.getElementById('drawer').classList.contains('open')) closeLead(); });
document.getElementById('theme').addEventListener('click', () => { theme = theme === '' ? 'dark' : theme === 'dark' ? 'light' : ''; try { localStorage.setItem('daime-tema', theme); } catch(e) {} applyTheme(); });
document.getElementById('sair').addEventListener('click', async () => { await SB.auth.signOut(); LEADS = []; FILA = []; showGate(); });
addEventListener('resize', () => { if (!document.getElementById('app').hidden) renderNav(); });

// ------------------------------------------------------------ início
function showGate(msg){ document.getElementById('app').hidden = true; document.getElementById('gate').hidden = false; document.getElementById('l-err').textContent = msg || ''; }
async function boot(){
  const { data: { session } } = await SB.auth.getSession();
  if (!session) return showGate();
  const dono = await SB.rpc('eh_dono');
  if (dono.error || dono.data !== true) { await SB.auth.signOut(); return showGate('Esta conta não tem acesso ao painel.'); }
  document.getElementById('gate').hidden = true; document.getElementById('app').hidden = false;
  await SB.rpc('montar_fila');
  await loadAll();
  const h0 = location.hash.slice(1); if (VIEWS.some(v => v.id === h0)) view = h0;
  renderNav(); render();
}
applyTheme(); boot();
</script>
</body>
</html>
