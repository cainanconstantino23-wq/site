<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">

<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: '#F8F5F0',
          darkInk: '#110F0E',
          cream: '#1C1917',
          primary: '#C87A2A',
          ember: '#B8531E',
          muted: '#78716C',
          border: '#E5DFD7',
          card: '#FFFFFF',
          cardAlt: '#F1ECE4',
          emeraldAccent: '#0D9488',
        },
        fontFamily: {
          sans: ['Inter', 'system-ui', 'sans-serif'],
          serif: ['Cormorant Garamond', 'Georgia', 'serif'],
          display: ['Bebas Neue', 'impact', 'sans-serif'],
          mono: ['Space Grotesk', 'monospace'],
        }
      }
    }
  }
</script>
<style>
  @font-face {
    font-family: 'Thunder-Black';
    src: url('Thunder-ExtraBoldLC') format('opentype');
  }

  body { background:#F8F5F0; color:#1C1917; font-family:'Inter',sans-serif; }
  .font-serif { font-family:'Cormorant Garamond', Georgia, serif; }
  .font-display { font-family:'Bebas Neue', impact, sans-serif; }
  .font-mono { font-family:'Space Grotesk', monospace; }
  .letter-tight { letter-spacing:-0.03em; }
  .letter-wide { letter-spacing:0.25em; }
  .grain::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");opacity:.4;mix-blend-mode:multiply;}
  html{scroll-behavior:smooth;}
  .reveal{opacity:0;transform:translateY(30px);transition:opacity .9s ease, transform .9s cubic-bezier(.22,1,.36,1);}
  .reveal.in{opacity:1;transform:none;}
  
  /* CAROUSEL STYLES */
  .carousel-track {
    display: flex;
    gap: 1.5rem;
    overflow-x: auto;
    overflow-y: hidden;
    touch-action: pan-y;
    scroll-snap-type: x proximity;
    overscroll-behavior-x: contain;
    overscroll-behavior-y: auto;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    cursor: default;
  }
  .carousel-track::-webkit-scrollbar { display: none; }
  
  .carousel-card { 
    flex: 0 0 82%; 
    scroll-snap-align: start; 
    box-sizing: border-box;
  }
  @media (min-width: 640px) { .carousel-card { flex: 0 0 calc(45% - 1rem); } }
  @media (min-width: 1024px) { .carousel-card { flex: 0 0 calc(31% - 1rem); } }

  .carousel-card video {
    pointer-events: none;
  }

  .play-btn-glow {
    box-shadow: 0 0 25px rgba(200, 122, 42, 0.3);
    transition: all 0.4s ease;
  }
  .carousel-card:hover .play-btn-glow {
    transform: scale(1.15);
    box-shadow: 0 0 35px rgba(200, 122, 42, 0.6);
    background-color: #1C1917;
    color: #F8F5F0;
  }
  .carousel-card:hover .card-bg-zoom { transform: scale(1.05); }

  .hero-headline {
    text-shadow: 0 10px 30px rgba(28,25,23,0.15);
  }
  .hero-line {
    display: block;
    font-family: 'Thunder-Black', 'Bebas Neue', sans-serif;
    line-height: 0.82;
    letter-spacing: 0.01em;
    text-transform: uppercase;
  }

  @media (max-width: 640px) {
    .hero-headline {
      line-height: 0.8;
    }
    .hero-line {
      font-size: clamp(3.1rem, 17vw, 6.1rem) !important;
      letter-spacing: 0.01em;
    }
  }
</style>
</head>
